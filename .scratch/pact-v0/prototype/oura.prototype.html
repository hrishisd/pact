<style>
/* Layout: the app at phone width on a desk surface, with the prototype panel beside it (behind a button on phones).

:root{

  --excused:#8f5c0c; --excused-bg:#f4e8cf;

}

#stage{height:100%;display:flex;gap:24px;justify-content:center;align-items:stretch;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

<script>
"use strict";
// ---------- dates and formatting (local time stands in for Oura's timezone) ----------
const MIN = 6e4, HOUR = 36e5, WINDOW = 48 * HOUR;
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEK = [1, 2, 3, 4, 5, 6, 0]; // Monday first, as in the app
const DAYBTN = { 1: "Mo", 2: "Tu", 3: "We", 4: "Th", 5: "Fr", 6: "Sa", 0: "Su" };
const at = (y, m, d, h = 0, mi = 0) => new Date(y, m - 1, d, h, mi).getTime();
const pad = n => String(n).padStart(2, "0");
const key = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const startOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
const addDays = (k, n) => { const [y, m, d] = k.split("-").map(Number); return key(new Date(y, m - 1, d + n).getTime()); };
const wday = k => new Date(startOf(k)).getDay();
const fmtDate = k => { const d = new Date(startOf(k)); return `${WD[d.getDay()]} ${MO[d.getMonth()]} ${d.getDate()}`; };
const clock = mins => { const h = Math.floor(mins / 60) % 24, m = mins % 60; return `${h % 12 || 12}:${pad(m)}${h < 12 ? "am" : "pm"}`; };
const fmtTime = t => { const d = new Date(t); return clock(d.getHours() * 60 + d.getMinutes()); };
const fmtWhen = t => `${WD[new Date(t).getDay()]} ${fmtTime(t)}`;
const timeLeft = ms => { const m = Math.floor(Math.max(0, ms) / MIN), h = Math.floor(m / 60); return h >= 1 ? `${h}h` : `${m % 60}m`; };
const timeLeftLong = ms => { const m = Math.floor(Math.max(0, ms) / MIN), h = Math.floor(m / 60); return `${h}h ${m % 60}m`; };
const money = c => "$" + (c % 100 ? (c / 100).toFixed(2) : c / 100);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/** The name filled in from the in-bed-by time: "In bed by midnight", "In bed by 11:30pm", "In bed by 1am". */
function bedName(mins) {
  if (mins === 0) return "In bed by midnight";
  const h = Math.floor(mins / 60), m = mins % 60;
  return `In bed by ${h % 12 || 12}${m ? ":" + pad(m) : ""}${h < 12 ? "am" : "pm"}`;
}

// ---------- icons ----------
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">${d}</svg>`;
const IC = {

// ---------- the world ----------
const GYM = { id: "gym", name: "Gym", kind: "camera", days: [1, 3, 5], pen: 500, rcp: "Red Cross" };
const TIME_CHOICES = [22 * 60, 22 * 60 + 30, 23 * 60, 23 * 60 + 30, 0, 30, 60];

let S;
function reset() {
  S = {
    now: at(2026, 11, 2, 15, 0), // Mon Nov 2, 3:00pm
    v: { connect: "A", time: "A", today: "B", missedLine: "yes" },
    connected: null, // the time Oura was connected, or null
    pacts: [],       // bedtime pacts
    periods: [],     // what Oura has reported so far: { type, start, arrived }
    tookL: {},       // "pactId|date" → true
    tab: "today", page: null, sheet: null, create: null, oauth: null,
    toast: null, log: [], sideOpen: false,
  };
}
function log(text) { S.log.unshift({ t: S.now, text }); }
function toast(text) { S.toast = text; clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; render(); }, 2600); }

// ---------- judging (the rules from the ticket) ----------
/** Night D's in-bed-by deadline: an evening time is on D, an after-midnight time is on D+1. */
const deadline = (p, d) => p.bedBy >= 18 * 60 ? startOf(d) + p.bedBy * MIN : startOf(addDays(d, 1)) + p.bedBy * MIN;
const windowOf = d => [startOf(d) + 18 * HOUR, startOf(addDays(d, 1)) + 18 * HOUR];
const scheduled = (p, d) => p.days.includes(wday(d)) && d >= p.first;

/** The first scheduled night whose in-bed-by time is at least 1 hour after creation. */
function firstNight(days, bedBy, created) {
  for (let d = key(created - 24 * HOUR), i = 0; i < 9; i++, d = addDays(d, 1))
    if (days.includes(wday(d)) && deadline({ bedBy }, d) - created >= HOUR) return d;
  return null;
}

/** Not judged yet, or Kept/Missed with when and why. Only periods Oura has reported by now count. */
function judge(p, d) {
  const [from, to] = windowOf(d);
  const first = S.periods
    .filter(x => x.type === "long_sleep" && x.start >= from && x.start < to && x.arrived <= S.now)
    .sort((a, b) => a.arrived - b.arrived || a.start - b.start)[0];
  if (first && first.arrived < to) return { outcome: first.start < deadline(p, d) ? "kept" : "missed", bedtime: first.start, judgedAt: first.arrived };
  if (S.now >= to) return { outcome: "missed", bedtime: null, judgedAt: to };
  return { outcome: null };
}

/** Nights from the pact's first up to the one whose window is open now. */
function nights(p) {
  const out = [];
  for (let d = p.first; startOf(d) + 18 * HOUR <= S.now; d = addDays(d, 1)) if (scheduled(p, d)) out.push(d);
  return out;
}

/** The night Today calls "tonight": the next scheduled night whose deadline hasn't passed, if it's today's or last night's. */
function tonight(p) {
  const today = key(S.now);
  for (const d of [addDays(today, -1), today]) if (scheduled(p, d) && deadline(p, d) > S.now && judge(p, d).outcome === null) return d;
  return null;
}

/** The night whose 6pm-to-6pm window is open now: the night Oura would report next. */
const currentNight = () => { const t = key(S.now); return S.now >= startOf(t) + 18 * HOUR ? t : addDays(t, -1); };

/** Polling: Oura is called each minute only while some night isn't judged yet. */
function waitingOnOura() {
  return S.pacts.flatMap(p => nights(p).filter(d => judge(p, d).outcome === null).map(d => ({ p, d })));
}

function advanceTo(t) {
  const before = new Map(S.pacts.flatMap(p => nights(p).map(d => [`${p.id}|${d}`, judge(p, d).outcome])));
  S.now = t;
  for (const p of S.pacts) for (const d of nights(p)) {
    const j = judge(p, d), was = before.get(`${p.id}|${d}`);
    if (j.outcome && !was) log(`${p.name}, ${fmtDate(d)} night: ${j.outcome === "kept" ? "Kept" : "Missed"}${j.bedtime ? ` (in bed ${fmtTime(j.bedtime)})` : " (no long_sleep by 6pm)"}`);
  }
}

/** The ring syncs: Oura now reports these periods (they arrive now). */
function sync(kind) {
  const d = currentNight(), base = startOf(d);
  const add = (type, h, m) => ({ type, start: base + (h * 60 + m) * MIN, arrived: S.now });
  const sets = {
    early: [add("long_sleep", 23, 40)],
    late: [add("long_sleep", 25, 0)],
    nap: [add("sleep", 19, 0), add("long_sleep", 23, 30)],
    twice: [add("long_sleep", 25, 10), add("long_sleep", 27, 0)],
  };
  const ps = sets[kind];
  if (ps.some(x => x.start > S.now)) return toast(`Move the clock past ${fmtWhen(Math.max(...ps.map(x => x.start)))} first.`);
  const before = new Map(S.pacts.map(p => [p.id, judge(p, d).outcome]));
  S.periods.push(...ps);
  log(`Ring synced ${fmtDate(d)} night: ${ps.map(x => `${x.type} ${fmtTime(x.start)}`).join(", ")}`);
  for (const p of S.pacts) if (scheduled(p, d) && !before.get(p.id)) {
    const j = judge(p, d);
    if (j.outcome) log(`${p.name}, ${fmtDate(d)} night: ${j.outcome === "kept" ? "Kept" : "Missed"} (in bed ${fmtTime(j.bedtime)})`);
  }
}

// ---------- rendering ----------
const app = () => document.getElementById("app");

function header(title, back) {
  return `<header class="hdr gut">${back ? `<button class="iconbtn" data-act="back" aria-label="Back">${IC.back}</button>` : ""}<h1>${esc(title)}</h1><button class="avatar" data-act="profile" aria-label="Profile">J</button></header>`;
}
function pactCard(p, chip, body, cls = "") {
  return `<article class="card tcard ${cls}" data-act="openPact" data-arg="${p.id}"><div class="spread"><h3>${esc(p.name)}</h3>${chip}</div><div class="meta pen">${money(p.pen)}</div>${body}</article>`;
}

function todayView() {
  const out = [], t = key(S.now);
  const head = `<div class="stack-sm"><span class="label">${fmtDate(t)}</span><span class="muted small">${fmtTime(S.now)}</span></div>`;
  // To do: the Camera pact, unchanged from main.
  if (GYM.days.includes(wday(t)))
    out.push(pactCard(GYM, `<span class="chip c-todo">To do</span>`, `<div class="meta due">Due at midnight · ${timeLeftLong(startOf(addDays(t, 1)) - S.now)}</div><div class="row2"><button class="btn primary" data-act="noop">${IC.camera}Take photo</button><button class="btn" data-act="noop">File excuse</button></div>`));
  // Missed: bedtime nights that can still be excused.
  for (const p of S.pacts) for (const d of nights(p)) {
    const j = judge(p, d);
    if (j.outcome !== "missed" || S.tookL[`${p.id}|${d}`] || S.now - j.judgedAt >= WINDOW) continue;
    const why = S.v.missedLine === "yes" ? (j.bedtime ? ` · in bed at ${fmtTime(j.bedtime)}` : " · no sleep data by 6pm") : "";
    out.push(pactCard(p, `<span class="chip c-missed">Missed</span>`, `<div class="meta">${fmtDate(d)} night${why}</div><div class="row2"><button class="btn" data-act="noop">File excuse · ${timeLeft(j.judgedAt + WINDOW - S.now)} left</button><button class="btn" data-act="takeL" data-arg="${p.id}|${d}">Take the L</button></div>`));
  }
  // Automatic: bedtime pacts that run tonight.
  const auto = S.pacts.map(p => ({ p, d: tonight(p) })).filter(x => x.d);
  if (auto.length) {
    if (S.v.today === "C") {
      out.push(`<section class="stack"><div class="label">Automatic</div><div class="cards">${auto.map(({ p, d }) => `<button class="rowbtn" data-act="openPact" data-arg="${p.id}"><span class="kico k-ring">${IC.ring}</span><span class="rt"><b>${esc(p.name)}</b><small>Tonight by ${clock(p.bedBy)} · <span class="pen">${money(p.pen)}</span></small></span></button>`).join("")}</div></section>`);
    } else {
      for (const { p, d } of auto) {
        const left = deadline(p, d) - S.now;
        let body = `<div class="meta">Tonight, in bed by ${clock(p.bedBy)} · ${timeLeftLong(left)}</div>`;
        if (S.v.today === "B") {
          const prev = nights(p).filter(n => n < d).pop();
          const j = prev && judge(p, prev);
          if (j && j.outcome === "kept" && S.now - j.judgedAt < 24 * HOUR)
            body += `<div class="lastnight"><span class="chip c-kept">Kept</span><span class="muted">Last night, in bed at ${fmtTime(j.bedtime)}</span></div>`;
        }
        out.push(pactCard(p, `<span class="chip c-soon">Automatic</span>`, body, "auto"));
      }
    }
  }
  const waiting = S.pacts.flatMap(p => nights(p).filter(d => judge(p, d).outcome === null && deadline(p, d) <= S.now).map(d => ({ p, d })));
  const ghost = waiting.length ? `<div class="note">${waiting.map(({ p, d }) => `${esc(p.name)}, ${fmtDate(d)} night isn't judged yet. Ticket 09 adds the orange No Oura data card here; until then Today shows nothing for it.`).join("<br>")}</div>` : "";
  if (!out.length) out.push(`<div class="card"><h3>Nothing to do right now</h3></div>`);
  return header("Today") + `<div class="scroll gut">${head}${ghost}${out.join("")}</div>`;
}

function pactsView() {
  const rows = [GYM, ...S.pacts].map(p => `<button class="rowbtn" data-act="openPact" data-arg="${p.id}"><span class="rt"><b>${esc(p.name)}</b><small>${p.days.length === 7 ? "Every day" : WEEK.filter(d => p.days.includes(d)).map(d => WD[d]).join(", ")} · <span class="pen">${money(p.pen)}</span></small></span></button>`).join("");
  return header("Pacts") + `<div class="scroll gut"><div class="cards">${rows}</div><button class="btn primary block" data-act="newPact">New pact</button></div>`;
}

function pactPage(id) {
  const p = id === "gym" ? GYM : S.pacts.find(x => x.id === id);
  const oura = p.kind === "oura";
  const terms = `<dl class="kv"><dt>Evidence</dt><dd>${oura ? "Oura Ring" : "Camera photo, checked by a reviewer"}</dd>${oura ? `<dt>In bed by</dt><dd>${clock(p.bedBy)}</dd>` : ""}<dt>Schedule</dt><dd>${p.days.length === 7 ? "Every day" : WEEK.filter(d => p.days.includes(d)).map(d => WD[d]).join(", ")}</dd><dt>Penalty</dt><dd>${money(p.pen)} per miss</dd><dt>Recipient</dt><dd>${esc(p.rcp)}</dd><dt>Reviewer</dt><dd>Sam</dd></dl>`;

}

function placeholder(title) { return header(title) + `<div class="scroll gut"><p class="muted">Not part of this prototype.</p></div>`; }

// ---------- create pact ----------
function steps(c) { return ["kind", ...(S.v.connect === "B" && c.needsConnect ? ["connect"] : []), "goal", "schedule", "penalty", "reviewers", "check"]; }
function createView() {
  const c = S.create, list = steps(c), i = list.indexOf(c.step), f = c.form;
  let body = "", problem = null;
  switch (c.step) {
    case "kind":
      body = `<h2>How will you prove it?</h2><div class="kind-tiles">
        <button class="kind-tile" data-act="pickCamera"><span class="tico">${IC.camera}</span><b>Camera</b><small>Take a photo each time. Your reviewer checks it.</small></button>
        <button class="kind-tile" data-act="pickOura"><span class="tico">${IC.ring}</span><b>Oura Ring</b><small>Your ring reports when you got into bed. Nothing to submit.</small></button>
      </div><small class="muted">You can't change this later.</small>`;
      break;
    case "connect":
      body = `<h2>Connect your Oura Ring</h2>
        <div class="card"><div class="row2"><span class="kico k-ring">${IC.ring}</span><b>Oura asks you to sign in and allow Pact.</b></div>
        <p>Pact checks when your main sleep each night starts. Your reviewers see only Kept or Missed and that time.</p></div>
        <small class="muted">You'll come back here to set your bedtime.</small>`;
      break;
    case "goal": {
      const field = S.v.time === "A"
        ? `<input class="inp time-inp" type="time" data-f="bedBy" value="${f.bedBy === null ? "" : pad(Math.floor(f.bedBy / 60)) + ":" + pad(f.bedBy % 60)}">`
        : `<div class="timechips">${TIME_CHOICES.map(m => `<button class="pill" data-act="bedBy" data-arg="${m}" aria-pressed="${f.bedBy === m && !f.other}">${clock(m)}</button>`).join("")}<button class="pill" data-act="other" aria-pressed="${!!f.other}">Other</button></div>${f.other ? `<input class="inp time-inp" type="time" data-f="bedBy" value="${f.bedBy === null ? "" : pad(Math.floor(f.bedBy / 60)) + ":" + pad(f.bedBy % 60)}">` : ""}`;
      body = `<h2>Goal</h2>
        <div class="field"><span>In bed by</span>${field}<small>Late is when your ring says you got into bed after this.</small></div>
        <label class="field"><span>Name</span><input class="inp" data-f="name" value="${esc(f.name)}" placeholder="e.g. In bed by midnight"><small>Shown on Today.</small></label>`;
      break;
    }
    case "schedule":
      body = `<h2>Schedule</h2><div class="field"><span>Nights</span><div class="days">${WEEK.map(d => `<button data-act="day" data-arg="${d}" aria-pressed="${f.days.includes(d)}">${DAYBTN[d]}</button>`).join("")}</div></div>
        <button class="btn sm self-start" data-act="everyDay" aria-pressed="${f.days.length === 7}">Every night</button>
        <small class="muted">Each night is judged when your ring syncs. A night with no sleep data by 6pm the next day counts as missed.</small>`;
      break;
    case "penalty":
      body = `<h2>Penalty</h2><label class="field"><span>Penalty per miss</span><span class="money-inp"><b>$</b><input class="inp" data-f="pen" inputmode="decimal" value="${esc(f.pen)}"></span></label>
        <div class="field"><span>Recipient</span><div class="opt" style="border-color:var(--accent);background:var(--accent-soft)"><span class="rt"><b>Red Cross</b></span></div><small>Who you pay when you miss.</small></div>`;
      break;
    case "reviewers":
      body = `<h2>Reviewers</h2><label class="opt"><input type="checkbox" data-f="sam" ${f.sam ? "checked" : ""}><span class="rt"><b>Sam</b></span></label>
        <small class="muted">Your ring decides each night, so there are no photos to review. Reviewers decide on your excuses.</small>`;
      break;
    case "check": {
      const first = firstNight(f.days, f.bedBy, S.now);
      body = `<h2>Check it over</h2><div class="card"><h3>${esc(f.name.trim())}</h3>
        <dl class="kv"><dt>Evidence</dt><dd>Oura Ring</dd><dt>In bed by</dt><dd>${clock(f.bedBy)}</dd><dt>Schedule</dt><dd>${f.days.length === 7 ? "Every day" : WEEK.filter(d => f.days.includes(d)).map(d => WD[d]).join(", ")}</dd><dt>Penalty</dt><dd>${money(Math.round(+f.pen * 100))} per miss</dd><dt>Recipient</dt><dd>Red Cross</dd><dt>Reviewer</dt><dd>Sam</dd></dl></div>
        <div class="alert info"><p>It's Active as soon as you create it. The first night is <b>${fmtDate(first)}</b>, in bed by ${clock(f.bedBy)}.</p></div>`;
      break;
    }
  }
  problem = problemOf(c);
  const left = i === 0 ? `<button class="btn" data-act="cancelCreate">Cancel</button>` : `<button class="btn" data-act="stepBack">Back</button>`;
  const right = c.step === "kind" ? "" : c.step === "connect" ? `<button class="btn primary grow" data-act="goOura">Connect Oura</button>` : c.step === "check" ? `<button class="btn primary grow" data-act="createPact">Create pact</button>` : `<button class="btn primary grow" data-act="next">Next</button>`;
  return header("New pact", true) + `<div class="scroll gut"><div class="stack"><div class="steps">${list.map((s, j) => `<i class="${j <= i ? "on" : ""}"></i>`).join("")}</div><small class="muted">Step ${i + 1} of ${list.length}</small></div>${body}${c.tried && problem ? `<p class="error">${problem}</p>` : ""}<div class="footbar">${left}${right}</div></div>`;
}

function ouraView() {
  return `<div class="oura"><div class="bar"><span>🔒</span><span class="url">cloud.ouraring.com/oauth/authorize?client_id=pact&amp;scope=daily</span></div>

function render() {
  let main;
  if (S.create) main = createView();
  else if (S.page) main = pactPage(S.page);
  else main = { today: todayView, pacts: pactsView, review: () => placeholder("Review"), ledgers: () => placeholder("Ledgers") }[S.tab]();
  const tabs = [["today", "Today"], ["pacts", "Pacts"], ["review", "Review"], ["ledgers", "Ledgers"]];
  app().innerHTML = `${main}<nav class="tabbar">${tabs.map(([id, l]) => `<button class="tab" data-act="tab" data-arg="${id}" ${S.tab === id ? 'aria-current="page"' : ""}><span class="tile">${IC[id]}${l}</span></button>`).join("")}</nav>
    ${S.sheet === "profile" ? profileSheet() : ""}${S.oauth ? ouraView() : ""}${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ""}`;
  renderSide();
}

function seg(field, opts) {
  return `<div class="seg">${opts.map(([v, l]) => `<button data-act="set" data-arg="${field},${v}" aria-pressed="${S.v[field] === v}">${l}</button>`).join("")}</div>`;
}

function renderSide() {
  const side = document.getElementById("side");
  side.classList.toggle("open", S.sideOpen);
  const wait = waitingOnOura();
  side.innerHTML = `
    <div class="spread"><h2>Ticket 08 prototype</h2><button class="btn sm" data-act="side" style="${matchMedia("(max-width:840px)").matches ? "" : "display:none"}">Close</button></div>
    <p class="small muted">Connect Oura, create an in-bed-by pact, and watch nights get judged. Start on Pacts → New pact, or skip ahead. Everything is in memory.</p>
    <section><span class="tag">DESIGN CHOICES</span>
      <div class="beh"><b>1. Tapping Oura Ring with no connection</b>${seg("connect", [["A", "A · Straight to Oura"], ["B", "B · Connect step first"]])}<p>A goes to Oura's page at once. B shows one step that says what Pact reads, then goes.</p></div>

    </section>
    <section><span class="tag">CLOCK</span><div class="clock">${fmtDate(key(S.now))}, ${fmtTime(S.now)}</div>
      <div class="btnrow"><button class="btn" data-act="adv" data-arg="1">+1h</button><button class="btn" data-act="adv" data-arg="3">+3h</button><button class="btn" data-act="to" data-arg="23.5">11:30pm</button><button class="btn" data-act="to" data-arg="8">Next 8am</button><button class="btn" data-act="to" data-arg="18">Next 6pm</button></div></section>
    <section><span class="tag">OURA</span>
      <p class="small">${S.connected === null ? "Not connected." : `Connected. ${wait.length ? `<b>Polling every minute</b>: ${wait.map(w => fmtDate(w.d) + " night").join(", ")} not judged yet.` : "No calls: nothing waiting on Oura."}`}</p>
      <p class="small muted">The ring syncs ${fmtDate(currentNight())} night now, reporting:</p>
      <div class="btnrow"><button class="btn" data-act="sync" data-arg="early">long_sleep 11:40pm</button><button class="btn" data-act="sync" data-arg="late">long_sleep 1:00am</button><button class="btn" data-act="sync" data-arg="nap">nap 7pm + long_sleep 11:30pm</button><button class="btn" data-act="sync" data-arg="twice">long_sleep 1:10am + 3:00am</button></div></section>
    <section><span class="tag">SHORTCUTS</span><div class="btnrow"><button class="btn" data-act="skip">Connected, pact made (every night, 12:00am)</button><button class="btn" data-act="reset">Reset</button></div></section>
    <section><span class="tag">WHAT HAPPENED</span><div class="log">${S.log.map(l => `<div><span class="t">${fmtWhen(l.t)}</span><br>${esc(l.text)}</div>`).join("") || `<p class="muted small">Nothing yet.</p>`}</div></section>
    <section><span class="tag">FOR LATER</span><ul class="qs">
      <li>The Oura page opens outside the installed app. Coming back reloads Pact, so the form saves where it was and returns to the Goal step.</li>
      <li>No Oura data, check now and disconnection are ticket 09.</li></ul></section>`;
}

// ---------- actions ----------
function newForm() { return { bedBy: null, name: "", named: false, days: [], pen: "5", sam: true, other: false }; }
function problemOf(c) {
  const f = c.form;
  switch (c.step) {
    case "goal": return f.bedBy === null ? "Pick a time." : !f.name.trim() ? "Give it a name." : null;
    case "schedule": return f.days.length ? null : "Pick at least one night.";
    case "penalty": return +f.pen > 0 ? null : "Enter an amount, like 5 or 2.50.";
    case "reviewers": return f.sam ? null : "Pick at least one reviewer.";
    default: return null;
  }
}
function goStep(dir) {
  const c = S.create, list = steps(c), i = list.indexOf(c.step);
  if (dir > 0 && problemOf(c)) { c.tried = true; return; }
  c.tried = false;
  const j = i + dir;
  if (j < 0) { S.create = null; return; }
  c.step = list[j];
  if (c.step === "connect" && S.connected !== null) c.step = list[j + dir] ?? "kind";
}
function makePact(f) {
  const p = { id: "p" + (S.pacts.length + 1), kind: "oura", name: f.name.trim(), bedBy: f.bedBy, days: [...f.days], pen: Math.round(+f.pen * 100), rcp: "Red Cross", created: S.now };
  p.first = firstNight(p.days, p.bedBy, S.now);
  S.pacts.push(p);
  log(`Created ${p.name}. First night ${fmtDate(p.first)}.`);
  return p;
}
function nextAt(hour) {
  let t = startOf(key(S.now)) + hour * HOUR;
  if (t <= S.now) t = startOf(addDays(key(S.now), 1)) + hour * HOUR;
  return t;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "closeSheet" && e.target.closest("[data-stop]") && !e.target.closest("button[data-act=closeSheet]")) return;
  const arg = el.dataset.arg;
  switch (el.dataset.act) {
    case "tab": S.tab = arg; S.page = null; S.create = null; break;
    case "back": if (S.create) goStep(-1); else S.page = null; break;
    case "openPact": S.page = arg; break;
    case "profile": S.sheet = "profile"; break;
    case "closeSheet": S.sheet = null; break;
    case "newPact": S.create = { step: "kind", form: newForm(), needsConnect: S.connected === null }; break;
    case "cancelCreate": S.create = null; break;
    case "pickCamera": toast("Camera works as on main. It isn't part of this prototype."); break;
    case "pickOura":
      S.create.needsConnect = S.connected === null;
      if (S.connected !== null) S.create.step = "goal";
      else if (S.v.connect === "A") S.oauth = true;
      else S.create.step = "connect";
      break;
    case "goOura": S.oauth = true; break;
    case "ouraAllow": S.oauth = null; S.connected = S.now; S.create.step = "goal"; log("Oura connected"); toast("Oura connected"); break;
    case "ouraDeny": S.oauth = null; S.create.step = "kind"; break;
    case "stepBack": goStep(-1); break;
    case "next": goStep(1); break;
    case "bedBy": { const f = S.create.form; f.bedBy = +arg; f.other = false; if (!f.named) f.name = bedName(f.bedBy); break; }
    case "other": S.create.form.other = true; break;
    case "day": { const f = S.create.form, d = +arg; f.days = f.days.includes(d) ? f.days.filter(x => x !== d) : [...f.days, d]; break; }
    case "everyDay": { const f = S.create.form; f.days = f.days.length === 7 ? [] : [...WEEK]; break; }
    case "createPact": makePact(S.create.form); S.create = null; S.tab = "today"; S.page = null; toast("Pact created"); break;
    case "takeL": S.tookL[arg] = true; break;
    case "noop": toast("Works as on main. Not part of this prototype."); break;
    case "set": { const [f, v] = arg.split(","); S.v[f] = v; break; }
    case "adv": advanceTo(S.now + +arg * HOUR); break;
    case "to": advanceTo(nextAt(+arg)); break;
    case "sync":
      if (S.connected === null) { toast("Connect Oura first."); break; }
      sync(arg); break;
    case "skip":
      reset(); S.connected = S.now; makePact({ name: "In bed by midnight", bedBy: 0, days: [...WEEK], pen: "5" }); break;
    case "reset": reset(); break;
    case "side": S.sideOpen = !S.sideOpen; break;
    default: return;
  }
  render();
});
document.addEventListener("input", e => {
  const el = e.target, f = S.create?.form;
  if (!f || !el.dataset.f) return;
  if (el.dataset.f === "name") { f.name = el.value; f.named = el.value.trim() !== "" && el.value !== bedName(f.bedBy ?? -1); return; }
  if (el.dataset.f === "pen") { f.pen = el.value; return; }
  if (el.dataset.f === "bedBy") {
    if (!el.value) return;
    const [h, m] = el.value.split(":").map(Number);
    f.bedBy = h * 60 + m;
    if (!f.named) { f.name = bedName(f.bedBy); const n = document.querySelector('[data-f="name"]'); if (n) n.value = f.name; }
  }
});
document.addEventListener("change", e => {
  const el = e.target, f = S.create?.form;
  if (f && el.dataset.f === "sam") { f.sam = el.checked; }
});

reset();
render();
</script>

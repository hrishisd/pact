  else { p = {id:nid('p'), owner:S.me, stage:'draft', thread:[], ...data}; S.pacts.push(p); }
  p.sent = sent; p.rejectReason = null; if (sent) p.sentAt = new Date(S.now);
  log(sent ? `${nameOf(S.me)} sent "${p.name}" to ${p.reviewers.map(nameOf).join(', ')} for review. It's a Draft until approved.` : `${nameOf(S.me)} saved "${p.name}" as a Draft.`);
  S.draft = null; S.form = {}; S.tab = 'pacts'; S.stack = [{name:'pact', id:p.id}];
  toast(sent ? 'Sent for review' : 'Draft saved');
}
function summaryLine(d){
  const when = d.kind === 'fixed' ? (d.days.length === 7 ? 'every day' : daysText(d.days)) : d.kind === 'weekly' ? `${d.target}× per week` : `by ${fmtDay(parseIso(d.deadline))}`;
  return `<b>${esc(d.name || 'Untitled')}</b> · ${when} · ${money(Number(d.penalty) || 0)} per miss → ${esc(rcp(d.recipientId)?.name || '?')} · reviewed by ${d.reviewers.map(nameOf).join(', ') || 'nobody yet'}`;
}
function renderCreate(){
  if (!S.draft) S.draft = newDraft();
  const d = S.draft, v = S.variant;
  if (v === 'A') {
    const steps = ['what','evidence','schedule','stakes','reviewers','reminders','check'];
    const i = S.form.cstep || 0, k = steps[i];
    const body = k === 'check' ? `<h2>Check it over</h2><div class="card">${termsList({...draftToPact(d), stage:'draft', reviewers:d.reviewers})}</div>${draftProblems(d).map(x => `<div class="alert warn">${x}</div>`).join('')}<p class="muted" style="margin:0">It stays a Draft until ${d.reviewers.map(nameOf).join(', ') || 'a reviewer'} approves it. Nothing is at stake until then.</p>`
      : `<h2>${FIELDS[k][0]}</h2>${FIELDS[k][1]()}`;
    return `<div class="stack"><div class="steps">${steps.map((_,j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div><small class="muted">Step ${i+1} of ${steps.length}</small></div>${body}
      <div class="footbar">${i > 0 ? `<button class="btn" data-act="cstep" data-arg="-1">Back</button>` : `<button class="btn" data-act="back">Cancel</button>`}
      ${k === 'check' ? `<button class="btn" data-act="saveDraft">Save draft</button><button class="btn primary" style="flex:1" data-act="sendDraft">Send for review</button>` : `<button class="btn primary" style="flex:1" data-act="cstep" data-arg="1">Next</button>`}</div>`;
  }
  if (v === 'B') {
    const ed = S.form.cedit;
    const b = (k, text) => `<button class="blank" data-act="cedit" data-arg="${k}" aria-expanded="${ed === k}">${text}</button>`;
    const when = d.kind === 'fixed' ? (d.days.length === 7 ? (d.evidence === 'oura' ? 'every night' : 'every day') : 'on ' + (d.days.length ? daysText(d.days) : '…')) : d.kind === 'weekly' ? `${d.target}× a week` : `by ${fmtDate(parseIso(d.deadline))}`;
    const sentence = `I commit to ${b('what', esc(d.name || 'something'))} ${b('schedule', when)}.
      ${d.evidence === 'oura' ? `${b('evidence', 'Oura')} checks I'm in bed by ${fmtHM(d.bedtime)}, and ${b('reviewers', d.reviewers.map(nameOf).join(' & ') || 'someone')} rules on my excuses.` : `I'll prove it with ${b('evidence', 'a photo')} that ${b('reviewers', d.reviewers.map(nameOf).join(' & ') || 'someone')} checks.`}
      Every miss costs me ${b('stakes', money(Number(d.penalty) || 0))}, paid to ${b('stakes', esc(rcp(d.recipientId)?.name || '…'))}.
      It starts ${b('schedule', d.start ? fmtDate(parseIso(d.start)) : 'once it’s approved')}.`;
    return `<p class="label" style="margin:0">Tap the underlined parts to change them</p><div class="sentence">${sentence}</div>
      <button class="link" style="align-self:flex-start" data-act="cedit" data-arg="reminders">${d.reminders.length ? `${d.reminders.length} reminder${d.reminders.length > 1 ? 's' : ''}: ${d.reminders.map(r => fmtHM(r.time)).join(', ')}` : 'No reminders'} · edit</button>
      ${ed ? `<div class="editor"><div class="spread"><b>${FIELDS[ed][0]}</b><button class="btn sm" data-act="cedit" data-arg="">Done</button></div>${FIELDS[ed][1]()}</div>` : ''}
      <div class="footbar"><button class="btn" data-act="saveDraft">Save draft</button><button class="btn primary" style="flex:1" data-act="sendDraft">Send to ${d.reviewers.map(nameOf).join(', ') || 'reviewer'}</button></div>`;
  }
  // C
  if (!S.form.tpl) {
    const T = [['bedtime','B','Bedtime','In bed by a set time, checked with Oura'],['gym','G','Gym or workout','Weekly count, photo evidence'],['once','1','One-time task','A single deadline, photo evidence'],['blank','+','Start blank','Set everything yourself']];
    return `<h2>What kind of pact?</h2><div class="stack">${T.map(([k,g,t,s]) => `<button class="opt" data-act="ctpl" data-arg="${k}"><span class="glyph">${g}</span><span><b>${t}</b><small>${s}</small></span></button>`).join('')}</div>`;
  }
  const sec = k => `<section class="card"><h3>${FIELDS[k][0]}</h3>${FIELDS[k][1]()}</section>`;
  return `${['what','evidence','schedule','stakes','reviewers','reminders'].map(sec).join('')}
    <div class="footbar" style="flex-direction:column;align-items:stretch"><div class="card" style="padding:10px 12px;font-size:13.5px" data-live="summary">${summaryLine(d)}</div><div class="row2" style="flex-wrap:nowrap"><button class="btn" data-act="saveDraft">Save draft</button><button class="btn primary" style="flex:1" data-act="sendDraft">Send for review</button></div></div>`;
}

/* ---------- Pacts + pact page ---------- */
function renderPacts(){
  const mine = S.pacts.filter(p => p.owner === S.me);
  const grp = (label, ps) => ps.length ? `<section class="stack"><div class="label">${label}</div><div class="list">${ps.map(p => `<button class="rowbtn" data-act="openPact" data-arg="${p.id}"><span class="rt"><b>${esc(p.name)}</b><small>${scheduleText(p)} · ${money(p.penalty)}/miss</small></span>${stageChip(p)}</button>`).join('')}</div></section>` : '';
  const ended = mine.filter(p => p.stage === 'ended');
  return `<button class="btn primary" data-act="create">New pact</button>
    ${grp('Drafts', mine.filter(p => p.stage === 'draft'))}${grp('Active', mine.filter(p => p.stage === 'active'))}
    ${ended.length ? `<details><summary class="label" style="cursor:pointer">Ended (${ended.length})</summary>${grp('', ended)}</details>` : ''}`;
}
function renderPact(id){
  const p = pact(id);
  const waiting = allItems().filter(i => i.pacts.includes(p) && i.owner === S.me);
  let actions = '';
  if (p.stage === 'draft' && !p.sent) actions = `<div class="row2"><button class="btn" data-act="editDraft" data-arg="${p.id}">Edit</button><button class="btn primary" data-act="resend" data-arg="${p.id}">Send for review</button></div>`;
  else if (p.stage === 'draft') actions = `<div class="alert info">Waiting for ${p.reviewers.map(nameOf).join(', ')} to approve. It becomes Active the day after approval.</div>`;
  else if (p.stage === 'active') actions = `<div class="row2"><button class="btn" data-act="excuse" data-arg="${p.id}|${todayKey()}">File excuse</button><button class="btn" data-act="change" data-arg="${p.id}">Request change</button></div>`;
  return `<div class="row2">${stageChip(p)}<span class="muted">${esc(p.desc)}</span></div>
    ${p.rejectReason && !p.sent ? `<div class="alert warn"><div><b>Sent back:</b> “${esc(p.rejectReason)}”</div></div>` : ''}
    ${actions}
    <section class="card"><h3>History</h3>${heatmap(p)}</section>
    ${waiting.length ? `<section class="stack"><div class="label">Waiting on ${p.reviewers.map(nameOf).join(', ')}</div><div class="list">${waiting.map(i => `<button class="rowbtn" data-act="openItem" data-arg="${keyOf(i)}"><span class="kind k-${i.kind}">${KIND[i.kind]}</span><span class="rt"><b>${esc(itemSub(i))}</b></span><span class="age">${age(i.at)}</span></button>`).join('')}</div></section>` : ''}
    <section class="card"><h3>Terms</h3>${termsList(p)}</section>`;
}

/* ---------- Review (3 variants) ---------- */
function itemBody(i){
  const o = i.obj, p = i.pacts[0];
  if (i.kind === 'pact') return `<div class="card"><h3>${esc(o.name)}</h3><div class="muted">${esc(o.desc)}</div>${termsList(o)}</div>
    <div class="muted" style="font-size:13.5px">If you approve, it becomes Active on ${fmtDay(parseIso(o.start && o.start > iso(addDays(S.now,1)) ? o.start : (o.schedule.kind === 'weekly' ? iso(addDays(weekStart(S.now),7)) : iso(addDays(S.now,1)))))}.</div>`;
  if (i.kind === 'change') {
    const rows = Object.keys(o.after).map(k => k === 'end' ? `<tr><td>Status</td><td>Active</td><td><b>Ended</b></td></tr>` : `<tr><td>${k === 'penalty' ? 'Penalty' : 'Days'}</td><td>${k === 'penalty' ? money(o.before.penalty) : daysText(o.before.days)}</td><td><b>${k === 'penalty' ? money(o.after.penalty) : daysText(o.after.days)}</b></td></tr>`).join('');
    return `<div class="card"><h3>${esc(p.name)}</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><tr class="muted"><td></td><td>Now</td><td>Requested</td></tr>${rows}</table></div>${o.reason ? `<div>“${esc(o.reason)}”</div>` : ''}<div class="muted" style="font-size:13px">The pact keeps its current terms until someone approves.</div></div>`;
  }
  if (i.kind === 'evidence') {
    const occ = occById(o.occId);
    const ph = o.photos[0];
    return `<div class="card"><div class="spread"><h3>${esc(p.name)}</h3><span class="meta">${money(p.penalty)}/miss</span></div>
      <div class="muted">What counts: ${esc(p.desc)}</div>
      ${o.photos.map(x => `<img class="big-photo" src="${x.src}" alt="Evidence photo">`).join('')}
      <dl class="kv"><dt>For</dt><dd>${p.schedule.kind === 'weekly' ? `${fmtDay(parseIso(o.day))}, week of ${fmtDate(parseIso(occ.key))} (${weekCount(occ)} of ${p.schedule.target} approved)` : occLabel(p, occ.key)}</dd>
      <dt>Window</dt><dd>${p.window ? `${fmtHM(p.window.from)}–${fmtHM(p.window.to)}` : 'Any time that day'}</dd>
      <dt>Received</dt><dd class="num">${fmtDay(o.receivedAt)} ${fmtTime(o.receivedAt)}</dd>
      <dt>Photo taken</dt><dd class="num">${ph?.taken ? `${fmtDay(ph.taken)} ${fmtTime(ph.taken)}` : 'Unknown (no photo metadata)'}</dd>
      ${o.note ? `<dt>Note</dt><dd>${esc(o.note)}</dd>` : ''}</dl></div>`;
  }
  if (i.kind === 'excuse') {
    const cov = [];
    for (const px of i.pacts) for (const occ of S.occurrences.filter(oc => oc.pactId === px.id && covers(o, px, oc.key))) cov.push(`<div class="row2" style="font-size:13.5px">${outcomeChip(occ.outcome)}<span>${esc(px.name)} · ${occLabel(px, occ.key)}${penaltiesOf(occ).some(x => x.status === 'held') ? ` · ${money(penaltiesOf(occ).reduce((a,x)=>a+x.amount,0))} on hold` : ''}</span></div>`);
    return `<div class="card"><h3>${o.from === o.to ? fmtDay(parseIso(o.from)) : `${fmtDay(parseIso(o.from))} – ${fmtDay(parseIso(o.to))}`}</h3>
      <div style="font-size:16px">“${esc(o.reason)}”</div>${o.photos.map(x => `<img class="big-photo" src="${x.src}" alt="Excuse attachment">`).join('')}
      <div class="label">Covers</div>${cov.join('') || '<span class="muted">Future dates only. They’ll be Excused when they come up.</span>'}
      <div class="muted" style="font-size:13px">Filed ${fmtDay(o.at)} ${fmtTime(o.at)}</div></div>`;
  }
  const l = ledger(o.owner, o.recipientId);
  return `<div class="card"><h3>${money(o.amount)} to ${esc(rcp(o.recipientId).name)}</h3>${o.photos.map(x => `<img class="big-photo" src="${x.src}" alt="Payment screenshot">`).join('')}
    <dl class="kv"><dt>Note</dt><dd>${esc(o.note || '—')}</dd><dt>Owes</dt><dd class="num">${money(l.owed)}${l.overdue ? ` (${money(l.overdue)} overdue)` : ''}</dd><dt>Sent</dt><dd class="num">${fmtDay(o.at)} ${fmtTime(o.at)}</dd></dl>
    <div class="muted" style="font-size:13px">Approving reduces ${nameOf(o.owner)}'s balance to ${money(Math.max(0, l.owed - o.amount))}.</div></div>`;
}
function composer(key, isOwner){
  const rej = S.form.rejecting === key, com = S.form.commenting === key || isOwner;
  return `${rej ? `<label class="field"><span>Why are you rejecting it? (required)</span><textarea class="inp" id="rej-${key}" data-tmp="reason" placeholder="e.g. This photo looks like it's from last week">${esc(S.tmp.reason || '')}</textarea></label><div class="row2"><button class="btn" data-act="cancelRej">Cancel</button><button class="btn danger" data-act="confirmRej" data-arg="${key}" data-needs="reason" ${(S.tmp.reason || '').trim() ? '' : 'disabled'}>Reject</button></div>` : ''}
    ${com && !rej ? `<label class="field"><span>${isOwner ? 'Reply' : 'Comment'}</span><textarea class="inp" id="com-${key}" data-tmp="comment" placeholder="${isOwner ? 'Answer your reviewer' : 'Ask for more info'}">${esc(S.tmp.comment || '')}</textarea></label><div class="row2"><button class="btn primary" data-act="sendCom" data-arg="${key}" data-needs="comment" ${(S.tmp.comment || '').trim() ? '' : 'disabled'}>Send</button>${isOwner ? '' : '<button class="btn" data-act="cancelCom">Cancel</button>'}</div>` : ''}`;
}
function decisionText(i){
  const o = i.obj;
  if (i.kind === 'pact') return o.stage === 'active' ? 'Approved. The pact is Active.' : o.rejectReason ? `Sent back: “${esc(o.rejectReason)}”` : '';
  if (o.status === 'approved') return `Approved${o.decidedBy ? ' by ' + nameOf(o.decidedBy) : ''}.`;
  if (o.status === 'rejected') return `Rejected: “${esc(o.reason || o.reason2 || '')}”`;
  return '';
}
function renderItemPage(key){
  const i = itemByKey(key); if (!i) return '<p>Gone.</p>';
  const isOwner = i.owner === S.me, pend = isPendingItem(i);
  const head = `<div class="row2"><span class="kind k-${i.kind}">${KIND[i.kind]}</span><span class="muted">from ${nameOf(i.owner)} · ${age(i.at)} ago</span></div>`;
  const decided = !pend ? `<div class="alert ${i.obj.status === 'rejected' || i.obj.rejectReason ? 'bad' : 'info'}">${decisionText(i)}</div>` : '';
  const bar = !isOwner && pend && !S.form.rejecting && S.form.commenting !== key ? `<div class="footbar"><button class="btn danger" data-act="reject" data-arg="${key}">Reject</button><button class="btn" data-act="comment" data-arg="${key}">Comment</button><button class="btn ok" style="flex:1" data-act="approve" data-arg="${key}">Approve</button></div>` : '';
  return `${head}${decided}${itemBody(i)}${threadHtml(i.obj.thread)}${pend ? composer(key, isOwner) : ''}${isOwner && pend ? `<div class="muted" style="font-size:13px">Waiting for ${i.pacts[0].reviewers.map(nameOf).join(', ')} to decide.</div>` : ''}${bar}`;
}
function renderReview(){
  const q = queueFor(S.me), v = S.variant;
  if (!q.length) return `<div class="card"><h3>Nothing to review</h3><p class="muted" style="margin:0">When ${friendsOf(S.me).map(nameOf).join(', ')} sends a new pact, photo, excuse, payment or change, it shows up here.</p></div>${S.me === 'you' ? '<button class="btn" data-act="as" data-arg="sam">Switch to Sam to see their queue</button>' : ''}`;
  const row = i => `<button class="rowbtn" data-act="openItem" data-arg="${keyOf(i)}"><span class="kind k-${i.kind}">${KIND[i.kind]}</span><span class="rt"><b>${esc(itemTitle(i))}</b><small>${nameOf(i.owner)} · ${esc(itemSub(i))}</small></span><span class="age">${age(i.at)}</span></button>`;
  if (v === 'A') {
    const soon = q.filter(i => prio(i) === 0), rest = q.filter(i => prio(i) === 1);
    return `${soon.length ? `<section class="stack"><div class="label">Decide soon</div><div class="list">${soon.map(row).join('')}</div></section>` : ''}
      ${rest.length ? `<section class="stack"><div class="label">Everything else · oldest first</div><div class="list">${rest.map(row).join('')}</div></section>` : ''}`;
  }
  if (v === 'B') {
    const idx = Math.min(S.form.ridx || 0, q.length - 1), i = q[idx], key = keyOf(i);
    const busy = S.form.rejecting === key || S.form.commenting === key;
    return `<div class="spread"><span class="counter">${idx+1} of ${q.length} to review</span><div class="row2">${q.length > 1 ? `<button class="btn sm" data-act="rskip" data-arg="-1">‹ Prev</button><button class="btn sm" data-act="rskip" data-arg="1">Skip ›</button>` : ''}</div></div>
      <div class="row2"><span class="kind k-${i.kind}">${KIND[i.kind]}</span><span class="muted">from ${nameOf(i.owner)} · ${age(i.at)} ago</span></div>
      ${itemBody(i)}${threadHtml(i.obj.thread)}${composer(key, false)}
      ${busy ? '' : `<div class="decide"><button class="btn danger" data-act="reject" data-arg="${key}">Reject</button><button class="btn" data-act="comment" data-arg="${key}">Ask</button><button class="btn ok" data-act="approve" data-arg="${key}">Approve</button></div>`}`;
  }
  // C: grouped by friend → pact, quick decisions inline
  const byOwner = {};
  for (const i of q) (byOwner[i.owner] ||= []).push(i);
  return Object.entries(byOwner).map(([owner, items]) => {
    const byPact = {};
    for (const i of items) { const k = i.kind === 'payment' ? 'Payments' : i.pacts[0].name; (byPact[k] ||= []).push(i); }
    return `<section class="stack group"><div class="spread"><h3>${nameOf(owner)}</h3><span class="counter">${items.length} item${items.length > 1 ? 's' : ''}</span></div>
      ${Object.entries(byPact).map(([pn, its]) => `<div class="list"><div class="rowbtn" style="background:var(--sunk)"><span class="rt"><b>${esc(pn)}</b></span></div>${its.map(i => {
        const key = keyOf(i), open = S.form.expanded === key, img = i.obj.photos?.[0]?.src;
        const quick = `<button class="round n" data-act="reject" data-arg="${key}" aria-label="Reject">✕</button><button class="round y" data-act="approve" data-arg="${key}" aria-label="Approve">✓</button>`;
        return `<div><div class="mini">${img ? `<img src="${img}" alt="">` : `<span class="kind k-${i.kind}">${KIND[i.kind]}</span>`}<button class="rt link" style="text-align:left;color:var(--ink);font-weight:400" data-act="expand" data-arg="${key}"><b>${img ? KIND[i.kind] + ': ' : ''}${esc(itemSub(i))}</b><br><small class="muted">${age(i.at)} ago · ${open ? 'hide details' : 'details'}</small></button>${S.form.rejecting === key ? '' : quick}</div>
          ${open || S.form.rejecting === key || S.form.commenting === key ? `<div class="stack gut" style="padding-bottom:12px">${open ? itemBody(i) + threadHtml(i.obj.thread) : ''}${composer(key, false)}${open && !S.form.commenting && !S.form.rejecting ? `<button class="btn sm" style="align-self:flex-start" data-act="comment" data-arg="${key}">Comment</button>` : ''}</div>` : ''}</div>`;
      }).join('')}</div>`).join('')}</section>`;
  }).join('');
}

/* ---------- Ledgers ---------- */
function renderLedgers(){
  const ls = ledgersOf(S.me);
  if (!ls.length) return `<div class="card"><h3>No ledgers yet</h3><p class="muted" style="margin:0">Each recipient gets a ledger once a pact names them.</p></div>`;
  return ls.map(({r, l}) => {
    const hist = [...l.pens.map(x => ({at:x.addedAt, html:`<span class="rt"><b>${esc(pact(x.pactId).name)}</b><small>${occLabel(pact(x.pactId), occById(x.occId).key)}${x.status === 'held' ? ' · on hold (excuse pending)' : x.dueAt <= S.now ? '' : ` · due ${fmtDate(x.dueAt)}`}</small></span><span class="num" style="color:var(--missed)">+${money(x.amount)}</span>`})),
                  ...l.pays.map(x => ({at:x.at, html:`<span class="rt"><b>Payment</b><small>${esc(x.note || '')} · ${x.status}</small></span><span class="num" style="color:${x.status === 'approved' ? 'var(--kept)' : 'var(--muted)'}">${x.status === 'rejected' ? '' : '−'}${money(x.amount)}</span>`}))].sort((a,b) => b.at - a.at);
    const showAll = S.form['hist-' + r.id];
    return `<article class="card"><div class="spread"><div><h3>${esc(r.name)}</h3><div class="meta">${r.kind === 'org' ? esc(r.link) : 'Friend'} · ${S.pacts.filter(p => p.owner === S.me && p.recipientId === r.id).map(p => esc(p.name)).join(', ')}</div></div>${l.overdue ? `<span class="chip c-missed">${money(l.overdue)} overdue</span>` : ''}</div>
      <div class="sumrow"><div><div class="bigmoney">${money(Math.max(0, l.shown))}</div><div class="meta">owed${l.pending ? ` · <b>${money(l.pending)} pending</b>` : ''}${l.held ? ` · ${money(l.held)} on hold` : ''}</div></div>
      <button class="btn primary sm" data-act="pay" data-arg="${r.id}" ${l.shown > 0 ? '' : 'disabled'}>Record payment</button></div>
      <div class="row2 meta"><span>Lifetime: <b class="num">${money(l.added)}</b> in penalties</span><span><b class="num">${money(l.paid)}</b> paid</span></div>
      <div class="list">${hist.slice(0, showAll ? 99 : 4).map(h => `<div class="rowbtn">${h.html}<span class="age">${fmtDate(h.at)}</span></div>`).join('')}</div>
      ${hist.length > 4 ? `<button class="link" style="align-self:flex-start" data-act="hist" data-arg="${r.id}">${showAll ? 'Show less' : `Show all ${hist.length}`}</button>` : ''}</article>`;
  }).join('') + `<p class="muted" style="font-size:13px;margin:0">Penalties are due 7 days after they’re added. Payments clear the oldest first.</p>`;
}

/* ---------- side panel ---------- */
function renderSide(){
  const qs = Object.keys(S.accounts).map(a => `<tr><td>${acct(a).name}</td><td>${queueFor(a).length}</td><td>${money(ledgersOf(a).reduce((x,y) => x + Math.max(0,y.l.shown), 0))}</td><td>${money(overdueTotal(a))}</td></tr>`).join('');
  const recent = S.occurrences.filter(o => o.key >= iso(addDays(S.now,-3))).sort((a,b) => a.key < b.key ? 1 : -1).slice(0, 8)
    .map(o => { const p = pact(o.pactId); return `<tr><td>${esc(p.name)}</td><td>${occLabel(p, o.key).replace('Night of ','')}</td><td>${o.outcome}</td></tr>`; }).join('');
  $('#side').innerHTML = `<div class="spread"><span class="tag">PROTOTYPE · THROWAWAY</span><button class="btn sm closeside" data-act="side">Close</button></div>
    <section><h2>Pact flows</h2><div class="muted" style="font-size:13.5px">What should Create pact, Review and Submit evidence look like? Each has three variants. Flip with the bar at the bottom or ← →. Everything else is one baseline design, so the variants sit in a real-looking app.</div></section>
    <section><div class="label">Signed in as</div><div class="seg">${Object.keys(S.accounts).map(a => `<button aria-pressed="${S.me === a}" data-act="as" data-arg="${a}">${acct(a).name}</button>`).join('')}</div><small class="muted">You own the bedtime and gym pacts and Sam reviews them. Sam owns a running pact that you review. Switch to act as the other person.</small></section>
    <section><div class="label">Jump to</div><div class="row2"><button class="btn sm" data-act="jump" data-arg="create">Create pact</button><button class="btn sm" data-act="jump" data-arg="review">Review</button><button class="btn sm" data-act="jump" data-arg="evidence">Submit evidence</button><button class="btn sm" data-act="jump" data-arg="ledgers">Ledgers</button></div>
      <table><tr><th>Screen</th><th>A</th><th>B</th><th>C</th></tr>${Object.entries(VARIANTS).map(([k,v]) => `<tr><td>${SCREEN_NAME[k]}</td>${['A','B','C'].map(x => `<td style="${S.variant === x ? 'font-weight:700' : ''}">${v[x]}</td>`).join('')}</tr>`).join('')}</table></section>
    <section><div class="label">Clock</div><div class="num">${fmtDay(S.now)}, ${fmtTime(S.now)}</div><div class="row2"><button class="btn sm" data-act="advance">Advance to tomorrow, noon</button></div><small class="muted">Judges today's photo pacts at the end of the day and last night's bedtime at noon. Penalties, overdue amounts and 48h excuse windows all follow the clock.</small>
      <label class="row2"><input type="checkbox" data-act="oura" data-arg="${S.ouraOk ? 'off' : 'on'}" ${S.ouraOk ? '' : 'checked'}> Simulate Oura disconnected</label>
      <button class="btn sm" data-act="reset" style="align-self:flex-start">Reset everything</button></section>
    <section><div class="label">State</div><table><tr><th>Account</th><th>To review</th><th>Owes</th><th>Overdue</th></tr>${qs}</table>
      <table><tr><th>Pact</th><th>Occurrence</th><th>Outcome</th></tr>${recent}</table></section>
    <section><div class="label">What just happened</div><div class="log">${S.log.slice(0, 10).map(l => `<div><span class="muted">${fmtTime(l.at)}</span> ${esc(l.text)}</div>`).join('')}</div></section>
    <section><div class="label">Questions this prototype raised</div><ul>
      <li>Should a stricter change (higher penalty, more days) apply right away, or also go through review? The prototype applies it right away.</li>
      <li>Before noon, Today shows last night's Oura time as "so far". Is a provisional result helpful, or confusing?</li>
      <li>Review B ("one at a time") hides the queue's shape. Is that fine when there are only a few items a day?</li>
      <li>Photos can come from the library. Is the "photo taken" time enough to catch reused photos?</li></ul></section>`;
}
function renderSwitcher(){
  const k = screenKey();
  const label = k ? `${S.variant} · ${VARIANTS[k][S.variant]}<small>${SCREEN_NAME[k]} variant</small>` : `Variant ${S.variant}<small>open Today, Create pact or Review</small>`;
  $('#switcher').innerHTML = `<button data-act="vprev" aria-label="Previous variant">←</button><div class="lbl" aria-live="polite">${label}</div><button data-act="vnext" aria-label="Next variant">→</button><button class="ctl" data-act="side">Controls</button>`;
}

/* ---------- shell ---------- */
let toastMsg = null, toastTimer;
function toast(m){ toastMsg = m; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastMsg = null; render(); }, 2200); }
const scrollMemo = {};
function viewId(){ const t = S.stack[S.stack.length-1]; return t ? t.name + (t.id || t.key || '') : S.tab; }
function render(){
  const sc = $('.scroll'); if (sc) scrollMemo[render.last] = sc.scrollTop;
  const top = S.stack[S.stack.length-1];
  let html;
  if (top?.name === 'capture') html = renderCapture(top);
  else {
    let title, sub = '', body;
    if (top?.name === 'create') { title = S.draft?.editing ? 'Edit draft' : 'New pact'; sub = VARIANTS.create[S.variant]; body = renderCreate(); }
    else if (top?.name === 'pact') { const p = pact(top.id); title = p.name; sub = scheduleText(p); body = renderPact(top.id); }
    else if (top?.name === 'item') { const i = itemByKey(top.key); title = i ? KIND[i.kind] : 'Item'; sub = i ? esc(itemTitle(i)) : ''; body = renderItemPage(top.key); }
    else {
      const T = {today:['Today', fmtDay(S.now)], pacts:['Pacts', 'Yours'], review:['Review', `${queueFor(S.me).length} waiting on you`], ledgers:['Ledgers', 'What you owe, by recipient']};
      [title, sub] = T[S.tab]; body = {today:renderToday, pacts:renderPacts, review:renderReview, ledgers:renderLedgers}[S.tab]();
    }
    const q = queueFor(S.me).length;
    html = `<header class="hdr gut">${top ? `<button class="iconbtn" data-act="back" aria-label="Back">${IC.back}</button>` : ''}<h1>${esc(title)}<span class="sub">${sub}</span></h1><button class="avatar" data-act="profile" aria-label="Profile">${acct(S.me).initial}</button></header>
      <main class="scroll gut">${body}</main>
      <nav class="tabbar" aria-label="Main">${['today','pacts','review','ledgers'].map(t => `<button class="tab" data-act="tab" data-arg="${t}" ${!top && S.tab === t ? 'aria-current="page"' : ''}>${IC[t]}${t[0].toUpperCase() + t.slice(1)}${t === 'review' && q ? `<span class="badge">${q}</span>` : ''}</button>`).join('')}</nav>`;
  }
  if (S.sheet) {
    const k = S.sheet.kind;
    const inner = k === 'evidence' ? evidenceSheet(pact(S.sheet.pactId)) : k === 'excuse' ? excuseSheet() : k === 'pay' ? paySheet() : k === 'change' ? changeSheet(pact(S.sheet.pactId)) : profileSheet();
    html += `<div class="overlay" data-act="closeSheet"><div class="sheet gut" role="dialog" aria-modal="true" data-stop><div class="grab"></div>${inner}</div></div>`;
  }
  if (toastMsg) html += `<div style="position:absolute;left:50%;transform:translateX(-50%);top:70px;z-index:40;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13.5px">${esc(toastMsg)}</div>`;
  $('#app').innerHTML = html;
  const id = viewId(); const nsc = $('.scroll'); if (nsc && render.last === id && scrollMemo[id]) nsc.scrollTop = scrollMemo[id]; render.last = id;
  renderSide(); renderSwitcher();
  $('#side').classList.toggle('open', S.sideOpen);
}
function liveUpdate(){
  document.querySelectorAll('[data-needs]').forEach(b => b.disabled = !(S.tmp[b.dataset.needs] || '').trim());
  const sum = document.querySelector('[data-live="summary"]'); if (sum && S.draft) sum.innerHTML = summaryLine(S.draft);
  const ex = document.querySelector('[data-live-ok="excuse"]'); if (ex) ex.disabled = !excusePreview().ok;
}

/* ---------- actions ---------- */
const ACT = {
  tab:a => { S.tab = a; S.stack = []; S.form = {}; S.sheet = null; },
  back:() => { const t = S.stack.pop(); if (t?.name === 'create') S.draft = null; if (t?.name === 'capture') S.tmp = {}; S.form.rejecting = S.form.commenting = null; },
  profile:() => { S.tmp = {}; S.sheet = {kind:'profile'}; },
  closeSheet:(a, el, e) => { if (e.target === el) { S.sheet = null; S.tmp = {}; } else return 'skip'; },
  create:() => { S.draft = null; S.form = {}; S.stack.push({name:'create'}); },
  openPact:a => { S.stack.push({name:'pact', id:a}); },
  openItem:a => { S.form = {}; S.tmp = {}; S.stack.push({name:'item', key:a}); },
  evidence:a => { S.tmp = {}; if (S.variant === 'A') S.sheet = {kind:'evidence', pactId:a}; else if (S.variant === 'B') S.stack.push({name:'capture', pactId:a}); else S.form.inline = a; },
  closeInline:() => { S.form.inline = null; S.tmp = {}; },
  sample:a => { (S.tmp.photos ||= []).push({src:PHOTO[a] || PHOTO.gym, taken:new Date(+S.now - 3*6e4)}); },
  retake:() => { S.tmp.photos = []; },
  submitEvidence:a => submitEvidence(a),
  excuse:a => { const [pid, key] = (a || '').split('|'); S.tmp = {pactIds:pid ? [pid] : [], from:key || todayKey(), to:key || todayKey(), photos:[]}; S.sheet = {kind:'excuse'}; },
  excuseFromCap:a => { S.stack.pop(); ACT.excuse(`${a}|${todayKey()}`); },
  exPact:(a, el) => { const s = new Set(S.tmp.pactIds || []); el.checked ? s.add(a) : s.delete(a); S.tmp.pactIds = [...s]; },
  submitExcuse:() => submitExcuse(),
  pay:a => { S.tmp = {recipientId:a, photos:[]}; S.sheet = {kind:'pay'}; },
  submitPay:() => submitPay(),
  change:a => { S.tmp = {}; S.sheet = {kind:'change', pactId:a}; },
  crDay:a => { const d = Number(a), s = new Set(S.tmp.days); s.has(d) ? s.delete(d) : s.add(d); S.tmp.days = [...s]; },
  crEnd:(a, el) => { S.tmp.end = el.checked; },
  submitChange:a => submitChange(a),
  approve:a => { decide(a, 'approve'); afterDecision(a); },
  reject:a => { S.form.rejecting = a; S.form.commenting = null; S.tmp.reason = ''; },
  cancelRej:() => { S.form.rejecting = null; },
  confirmRej:a => { if (!(S.tmp.reason || '').trim()) return; decide(a, 'reject', S.tmp.reason.trim()); afterDecision(a); },
  comment:a => { S.form.commenting = a; S.form.rejecting = null; S.tmp.comment = ''; },
  cancelCom:() => { S.form.commenting = null; },
  sendCom:a => { comment(a, S.tmp.comment || ''); toast('Comment sent'); },
  rskip:a => { const n = queueFor(S.me).length; S.form = {ridx:((S.form.ridx || 0) + Number(a) + n) % n}; },
  expand:a => { S.form.expanded = S.form.expanded === a ? null : a; },
  ack:a => { const e = S.evidence.find(x => x.id === a); if (e) e.ack = true; },
  // create
  cstep:a => { S.form.cstep = Math.max(0, Math.min(6, (S.form.cstep || 0) + Number(a))); },
  cedit:a => { S.form.cedit = S.form.cedit === a || !a ? null : a; },
  ctpl:a => { S.draft = newDraft(a); S.form.tpl = a; },
  cset:a => { const [k, v] = a.split('='); S.draft[k] = v; if (k === 'evidence' && v === 'oura') { S.draft.kind = S.draft.kind === 'once' ? 'fixed' : S.draft.kind; S.draft.windowOn = false; } },
  cday:a => { const d = Number(a), s = new Set(S.draft.days); s.has(d) ? s.delete(d) : s.add(d); S.draft.days = [...s]; },
  ctarget:a => { S.draft.target = Math.max(1, Math.min(7, S.draft.target + Number(a))); },
  cwin:(a, el) => { S.draft.windowOn = el.checked; },
  crev:(a, el) => { const s = new Set(S.draft.reviewers); el.checked ? s.add(a) : s.delete(a); S.draft.reviewers = [...s]; },
  crem:a => { S.draft.reminders.splice(Number(a), 1); },
  cremadd:() => { S.draft.reminders.push({time:'20:00', channel:'Push'}); },
  addOrg:() => { const d = S.draft; if (!d.newOrg.trim()) return; const r = {id:nid('rc'), owner:S.me, kind:'org', name:d.newOrg.trim(), link:d.newOrgLink.trim() || '—'}; S.recipients.push(r); d.recipientId = r.id; d.newOrg = d.newOrgLink = ''; log(`Added recipient "${r.name}".`); },
  saveDraft:() => sendDraft(false),
  sendDraft:() => sendDraft(true),
  editDraft:a => { const p = pact(a); S.draft = {...newDraft(), name:p.name, desc:p.desc, evidence:p.evidence, kind:p.schedule.kind, days:p.schedule.days || [1,3,5], target:p.schedule.target || 3, deadline:p.schedule.deadline || iso(addDays(S.now,30)), bedtime:p.bedtime || '00:00', windowOn:!!p.window, start:p.start || '', end:p.end || '', penalty:p.penalty, recipientId:p.recipientId, reviewers:[...p.reviewers], reminders:p.reminders.map(r => ({...r})), editing:p.id}; S.form = {tpl:'edit'}; S.stack.push({name:'create'}); },
  resend:a => { const p = pact(a); p.sent = true; p.sentAt = new Date(S.now); p.rejectReason = null; log(`${nameOf(S.me)} sent "${p.name}" for review again.`); toast('Sent for review'); },
  // prototype controls
  vprev:() => cycle(-1), vnext:() => cycle(1),
  side:() => { S.sideOpen = !S.sideOpen; },
  as:a => { S.me = a; S.stack = []; S.sheet = null; S.form = {}; S.tmp = {}; S.draft = null; S.sideOpen = false; log(`Now signed in as ${acct(a).name}.`); },
  jump:a => { S.sheet = null; S.form = {}; S.draft = null; S.sideOpen = false;
    if (a === 'create') { S.tab = 'pacts'; S.stack = [{name:'create'}]; }
    else if (a === 'review') { if (!queueFor(S.me).length && queueFor('sam').length) S.me = 'sam'; S.tab = 'review'; S.stack = []; }
    else if (a === 'evidence') { S.me = 'you'; S.tab = 'today'; S.stack = []; const p = S.pacts.find(x => x.owner === 'you' && x.evidence === 'photo' && x.stage === 'active' && scheduledOn(x, S.now)); if (p) ACT.evidence(p.id); else toast('No photo pact due today. Advance the clock.'); }
    else { S.tab = a; S.stack = []; } },
  advance:() => { const t = addDays(sod(S.now), 1); t.setHours(12,0,0,0); advanceTo(t); S.sheet = null; },
  oura:a => { S.ouraOk = a === 'on'; log(S.ouraOk ? 'Oura reconnected.' : 'Oura disconnected (simulated). You get an alert and a push notification.'); },
  reset:() => { const v = S.variant; S = seed(); S.variant = v; },
  invite:() => { S.tmp.invite = true; },
  copy:() => { try { navigator.clipboard.writeText('pact.app/i/7Kq2xV').then(() => toast('Link copied'), () => toast('Select the link to copy it')); } catch(e) { toast('Select the link to copy it'); } return 'skip'; },
  hist:a => { S.form['hist-' + a] = !S.form['hist-' + a]; },
};
function afterDecision(key){
  const top = S.stack[S.stack.length-1];
  if (top?.name === 'item' && top.key === key) S.stack.pop();
  const q = queueFor(S.me).length;
  if (S.variant === 'B') S.form = {ridx:Math.min(S.form.ridx || 0, Math.max(0, q - 1))};
  toast(q ? `Done. ${q} left` : 'Queue cleared');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // handled on change
  if (el.closest('[data-stop]') && el.dataset.act === 'closeSheet') return;
  const r = ACT[el.dataset.act]?.(el.dataset.arg, el, e);
  if (r !== 'skip') render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.file !== undefined && t.files?.length) {
    const files = [...t.files]; let n = files.length;
    for (const f of files) { const rd = new FileReader(); rd.onload = () => { (S.tmp.photos ||= []).push({src:rd.result, taken:new Date(f.lastModified)}); if (--n === 0) render(); }; rd.readAsDataURL(f); }
    return;
  }
  if (t.type === 'checkbox' && t.dataset.act) { ACT[t.dataset.act]?.(t.dataset.arg, t, e); render(); return; }
  if (t.dataset.f !== undefined) { setField(t); if (t.tagName === 'SELECT') render(); return; }
  if (t.dataset.tmp !== undefined) { S.tmp[t.dataset.tmp] = t.value; if (t.dataset.rerender !== undefined) render(); else liveUpdate(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f !== undefined) { setField(t); liveUpdate(); }
  else if (t.dataset.tmp !== undefined && t.dataset.rerender === undefined) { S.tmp[t.dataset.tmp] = t.value; liveUpdate(); }
});
function setField(t){
  const path = t.dataset.f.split('.'); let o = S.draft;
  for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length-1]] = t.dataset.num !== undefined ? Number(t.value) : t.value;
}
document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if (a && (a.matches('input,textarea,select') || a.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
window.addEventListener('hashchange', () => { const v = readVariant(); if (v !== S.variant) setVariant(v); });

S = seed(); S.variant = readVariant(); render();
</script>

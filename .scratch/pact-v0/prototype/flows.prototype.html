<title>Pact Flow Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE — throwaway. Answers: "What should Today, Create pact, Review and Submit evidence look like?"
  Three variants (A/B/C) of Create pact, Review and Submit evidence, switchable via ?variant= (or #variant-b)
  and the floating bar. The rest of the app (Today, Pacts, Ledgers) is one baseline design so the variants
  sit inside a populated app. All state is in memory; reload to reset.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a phone-width app (the PWA) centred on a desk surface, with a prototype control panel beside it on wide screens. */
:root{
  --paper:#F1F4F0; --surface:#FFFFFF; --sunk:#E5EAE5; --desk:#D9E0DA;
  --ink:#17221D; --muted:#56645C; --line:#D2DAD4;
  --accent:#22457A; --accent-ink:#FFFFFF; --accent-soft:#E1E8F3;
  --kept:#2B7347; --kept-bg:#DCEEE2;
  --missed:#AD3227; --missed-bg:#F6DFDA;
  --excused:#8F5C0C; --excused-bg:#F4E8CF;
  --pending:#565C7C; --pending-bg:#E4E6EF;
  --scrim:rgba(14,22,18,.45);
  --proto:#2A2140; --proto-ink:#F3EEFF; --proto-line:#8C7BC4;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111815; --surface:#18211D; --sunk:#202B26; --desk:#0A0F0D;
  --ink:#E4ECE7; --muted:#9AA8A0; --line:#2B3832;
  --accent:#93B4EA; --accent-ink:#0D1A2D; --accent-soft:#1E2B40;
  --kept:#72C994; --kept-bg:#1B3325; --missed:#F08C80; --missed-bg:#3A1F1B;
  --excused:#E2B464; --excused-bg:#382C16; --pending:#AEB2CC; --pending-bg:#262839;
  --scrim:rgba(0,0,0,.6); --proto:#E9E2FF; --proto-ink:#1C1530; --proto-line:#6B5AA8;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111815; --surface:#18211D; --sunk:#202B26; --desk:#0A0F0D;
  --ink:#E4ECE7; --muted:#9AA8A0; --line:#2B3832;
  --accent:#93B4EA; --accent-ink:#0D1A2D; --accent-soft:#1E2B40;
  --kept:#72C994; --kept-bg:#1B3325; --missed:#F08C80; --missed-bg:#3A1F1B;
  --excused:#E2B464; --excused-bg:#382C16; --pending:#AEB2CC; --pending-bg:#262839;
  --scrim:rgba(0,0,0,.6); --proto:#E9E2FF; --proto-ink:#1C1530; --proto-line:#6B5AA8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
small{font-size:12.5px}

#stage{height:100%;display:flex;gap:28px;justify-content:center;align-items:stretch;padding-block:20px 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#phone{position:relative;width:400px;max-width:100%;height:100%;max-height:880px;background:var(--paper);border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 18px 50px -24px rgba(10,20,15,.45)}
#side{width:360px;min-width:0;height:100%;max-height:880px;overflow:auto;background:var(--surface);border:1.5px dashed var(--proto-line);border-radius:18px;padding:18px}
@media (max-width:820px){
  #stage{padding:0}
  #phone{width:100%;max-height:none;border:0;border-radius:0;box-shadow:none}
  #side{display:none;position:fixed;inset:0;z-index:60;width:auto;max-height:none;border-radius:0;border:0;padding-block:18px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #side.open{display:block}
}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:821px){.gut{padding-left:18px;padding-right:18px}}

/* app shell */
#app{height:100%;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
.hdr h1{font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .sub{display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;border:0;flex:none}
.scroll{flex:1;overflow:auto;padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tab{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--missed);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:17px}
.card .meta{font-size:12.5px;color:var(--muted)}
.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.c-kept{background:var(--kept-bg);color:var(--kept)}
.c-missed{background:var(--missed-bg);color:var(--missed)}
.c-excused{background:var(--excused-bg);color:var(--excused)}
.c-pending{background:var(--pending-bg);color:var(--pending)}
.c-open{background:var(--accent-soft);color:var(--accent)}
.c-draft{background:var(--sunk);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--missed);border-color:var(--missed)}
.btn.ok{background:var(--kept);border-color:var(--kept);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.alert{border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;border:1px solid}
.alert.bad{background:var(--missed-bg);border-color:var(--missed);color:var(--ink)}
.alert.warn{background:var(--excused-bg);border-color:var(--excused)}
.alert.info{background:var(--accent-soft);border-color:var(--accent)}
.alert b{font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600}
.field small{color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea.inp{min-height:76px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block}
.opt small{color:var(--muted)}
.glyph{width:36px;height:36px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos img,.ph-add{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--sunk);max-width:100%}
.ph-add{display:grid;place-items:center;border-style:dashed;font-size:26px;color:var(--muted);cursor:pointer}
.big-photo{width:100%;border-radius:14px;border:1px solid var(--line);max-height:340px;object-fit:cover}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{background:var(--sunk);border-radius:12px;padding:8px 11px;font-size:14px;max-width:88%}
.msg.mine{align-self:flex-end;background:var(--accent-soft)}
.msg small{display:block;color:var(--muted);font-size:11.5px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.rowbtn{display:flex;gap:10px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left;width:100%}
.rowbtn .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rowbtn .rt small{color:var(--muted)}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 6px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.k-pact,.k-change{background:var(--excused-bg);color:var(--excused)}
.age{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bigmoney{font-family:var(--f-mono);font-size:30px;font-weight:500;letter-spacing:-.02em}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--kept);display:block}
.dots i.on{background:var(--kept)}
.dots i.wait{border-color:var(--pending);background:var(--pending-bg)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat .c{width:15px;height:15px;border-radius:4px;background:var(--sunk)}
.heat .c.kept{background:var(--kept)} .heat .c.missed{background:var(--missed)} .heat .c.excused{background:var(--excused)}
.heat .c.pending{background:var(--pending-bg);outline:1.5px solid var(--pending);outline-offset:-1.5px}
.heat .c.open{background:var(--accent-soft);outline:1.5px solid var(--accent);outline-offset:-1.5px}
.heat .c.future{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.heat .c.lbl{background:none;font-size:10px;color:var(--muted);line-height:15px;text-align:right;width:14px}
.heat.weekly{grid-template-rows:15px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* sheets */
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:30}
.sheet{background:var(--paper);width:100%;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding-block:10px 120px;display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-size:20px}

/* capture (evidence variant B) */
.capture{height:100%;background:#0E1311;color:#EEF2EF;display:flex;flex-direction:column}
.capture .top{display:flex;justify-content:space-between;align-items:center;padding-block:14px}
.capture .vf{flex:1;margin:0 16px;border-radius:22px;border:2px dashed rgba(238,242,239,.35);display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;min-height:0}
.capture .vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.capture .bottom{padding-block:16px 110px;display:flex;flex-direction:column;gap:12px}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #EEF2EF;background:rgba(238,242,239,.15);margin:0 auto;display:block;cursor:pointer}
.capture .inp{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#EEF2EF}
.capture .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#EEF2EF}
.capture .btn.primary{background:#EEF2EF;color:#0E1311;border-color:#EEF2EF}
.ccount{font-family:var(--f-mono);font-size:13px;color:rgba(238,242,239,.75)}

/* create variant B sentence */
.sentence{font-family:var(--f-display);font-size:24px;line-height:1.5;font-weight:500;letter-spacing:-.01em}
.blank{font:inherit;background:var(--accent-soft);color:var(--accent);border:0;border-bottom:2px solid var(--accent);border-radius:6px 6px 2px 2px;padding:0 6px;margin:0 1px;cursor:pointer;line-height:1.25}
.blank[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.editor{border:1.5px solid var(--accent);border-radius:16px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}

/* steps */
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.footbar{position:sticky;bottom:-120px;margin-top:auto;display:flex;gap:10px;padding-block:12px 4px;background:linear-gradient(to bottom,transparent,var(--paper) 30%)}

/* review B */
.decide{position:sticky;bottom:-110px;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;padding-block:10px 4px;background:linear-gradient(to bottom,transparent,var(--paper) 25%)}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.group h3{font-size:16px}
.mini{display:flex;gap:10px;align-items:center;padding:10px 12px}
.mini img{width:44px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.mini .rt{flex:1;min-width:0}
.round{width:38px;height:38px;border-radius:50%;border:1.5px solid;background:var(--surface);font-size:17px;display:grid;place-items:center;flex:none}
.round.y{border-color:var(--kept);color:var(--kept)} .round.n{border-color:var(--missed);color:var(--missed)}

/* side panel + switcher (prototype chrome — deliberately not part of the design) */
#side h2{font-size:18px}
#side section{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px dashed var(--line)}
#side .tag{align-self:flex-start;background:var(--proto);color:var(--proto-ink);font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.08em}
#side .log{font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:6px}
#side .log div{border-left:2px solid var(--proto-line);padding-left:8px}
#side table{width:100%;border-collapse:collapse;font-size:12.5px}
#side td,#side th{padding:3px 4px;text-align:left;border-bottom:1px solid var(--line)}
#side th{color:var(--muted);font-weight:600}
#side ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
#switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:4px;background:var(--proto);color:var(--proto-ink);border-radius:999px;padding:5px;box-shadow:0 10px 28px -10px rgba(0,0,0,.55);max-width:calc(100vw - 24px)}
#switcher button{background:none;border:0;color:inherit;height:34px;min-width:34px;border-radius:999px;font-size:16px}
#switcher button:hover{background:rgba(127,127,127,.25)}
#switcher .lbl{font-family:var(--f-mono);font-size:12.5px;padding:0 6px;text-align:center;line-height:1.2;min-width:0}
#switcher .lbl small{display:block;opacity:.7;font-size:10.5px}
#switcher .ctl{font-family:var(--f-mono);font-size:12px;padding:0 10px;border-left:1px solid rgba(127,127,127,.4);border-radius:0 999px 999px 0}
@media (min-width:821px){#switcher .ctl,#side .closeside{display:none}}
@media (max-width:820px){#switcher{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div id="stage">
  <div id="phone"><div id="app"></div></div>
  <aside id="side" aria-label="Prototype controls"></aside>
</div>
<div id="switcher" role="toolbar" aria-label="Prototype variant switcher"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const HOUR = 36e5, DAYMS = 864e5;
const D = (y,m,d,h=0,mi=0) => new Date(y,m-1,d,h,mi);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n, d.getHours(), d.getMinutes());
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const eod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59);
const weekStart = d => addDays(sod(d), -((d.getDay()+6)%7));
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDay = d => `${WD[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`;
const fmtDate = d => `${MON[d.getMonth()]} ${d.getDate()}`;
const fmtTime = d => { let h = d.getHours(); const ap = h>=12?'pm':'am'; h = h%12||12; return `${h}:${pad(d.getMinutes())}${ap}`; };
const fmtHM = hm => { const [h,m] = hm.split(':').map(Number); return fmtTime(new Date(2000,0,1,h,m)); };
const fmtMin = m => fmtTime(new Date(2000,0,1,Math.floor(m/60)%24,m%60));
const deadlineMin = hm => { const [h,m] = hm.split(':').map(Number); let v = h*60+m; if (v < 18*60) v += 1440; return v; };
const money = n => '$' + (Number.isInteger(n) ? n : n.toFixed(2));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uid = 100; const nid = p => p + '-' + (uid++);

/* ---------- lookups and domain rules (simplified) ---------- */
let S;
const pact = id => S.pacts.find(p => p.id === id);
const rcp = id => S.recipients.find(r => r.id === id);
const acct = id => S.accounts[id];
const nameOf = id => id === S.me ? 'You' : acct(id).name;
const todayKey = () => iso(S.now);
const friendsOf = id => Object.keys(S.accounts).filter(a => a !== id);
function log(text){ S.log.unshift({at:new Date(S.now), text}); }

function scheduledOn(p, d){
  const k = iso(d);
  if (p.start && k < p.start) return false;
  if (p.end && k > p.end) return false;
  if (p.schedule.kind === 'fixed') return p.schedule.days.includes(d.getDay());
  return false;
}
function occKey(p, d){
  if (p.schedule.kind === 'weekly') return iso(weekStart(d));
  if (p.schedule.kind === 'once') return p.schedule.deadline;
  return iso(d);
}
function findOcc(p, key){ return S.occurrences.find(o => o.pactId === p.id && o.key === key); }
function getOcc(p, key){
  let o = findOcc(p, key);
  if (!o) { o = {id:nid('o'), pactId:p.id, key, outcome:'pending', detail:''}; S.occurrences.push(o); }
  return o;
}
function occLabel(p, key){
  const d = parseIso(key);
  if (p.evidence === 'oura') return `Night of ${fmtDay(d)}`;
  if (p.schedule.kind === 'weekly') return `Week of ${fmtDate(d)}`;
  if (p.schedule.kind === 'once') return `Due ${fmtDay(d)}`;
  return fmtDay(d);
}
const evFor = occ => S.evidence.filter(e => e.occId === occ.id);
function covers(x, p, key){
  if (!x.pactIds.includes(p.id)) return false;
  if (p.schedule.kind === 'weekly') { const end = iso(addDays(parseIso(key),6)); return !(x.to < key || x.from > end); }
  return key >= x.from && key <= x.to;
}
const excuseFor = (p, key, status) => S.excuses.find(x => x.status === status && covers(x, p, key));
function penaltiesOf(occ){ return S.penalties.filter(x => x.occId === occ.id && x.status !== 'removed'); }

function missOcc(p, occ, at, detail, mult=1){
  occ.outcome = 'missed'; occ.detail = detail; occ.judgedAt = new Date(at);
  addPenalty(S, occ, at, excuseFor(p, occ.key, 'pending') ? 'held' : 'owed', mult);
}
function judgeNight(p, key, at){
  const occ = getOcc(p, key); if (occ.outcome !== 'pending') return;
  if (excuseFor(p, key, 'approved')) { occ.outcome='excused'; occ.detail='Excused'; occ.judgedAt=at; return log(`${p.name}: ${occLabel(p,key)} → Excused (approved excuse).`); }
  if (!S.ouraOk) { missOcc(p, occ, at, 'No Oura data by noon'); return log(`${p.name}: ${occLabel(p,key)} → Missed, no Oura data. ${money(p.penalty)} penalty.`); }
  const bed = cannedBed(key);
  if (bed < deadlineMin(p.bedtime)) { occ.outcome='kept'; occ.detail='In bed '+fmtMin(bed); occ.judgedAt=at; log(`${p.name}: ${occLabel(p,key)} → Kept (in bed ${fmtMin(bed)}).`); }
  else { missOcc(p, occ, at, 'In bed '+fmtMin(bed)); log(`${p.name}: ${occLabel(p,key)} → Missed (in bed ${fmtMin(bed)}). ${money(p.penalty)} penalty.`); }
}
function judgeDay(p, key, at){
  const occ = getOcc(p, key); if (occ.outcome !== 'pending') return;
  const evs = evFor(occ);
  if (evs.some(e => e.status === 'approved')) { occ.outcome='kept'; occ.detail='Photo approved'; occ.judgedAt=at; return; }
  if (excuseFor(p, key, 'approved')) { occ.outcome='excused'; occ.detail='Excused'; occ.judgedAt=at; return log(`${p.name}: ${occLabel(p,key)} → Excused.`); }
  if (evs.some(e => e.status === 'pending')) { occ.detail='Day ended; photo still waiting for review'; return log(`${p.name}: ${occLabel(p,key)} ended with a photo still waiting for review. Result waits for the decision.`); }
  missOcc(p, occ, at, 'No photo submitted'); log(`${p.name}: ${occLabel(p,key)} → Missed (no photo). ${money(p.penalty)} penalty.`);
}
function weekCount(occ){ return new Set(evFor(occ).filter(e => e.status === 'approved').map(e => e.day)).size; }
function judgeWeek(p, key, at){
  const occ = getOcc(p, key); if (occ.outcome !== 'pending') return;
  const n = weekCount(occ), t = p.schedule.target;
  if (n >= t) { occ.outcome='kept'; occ.detail=`${n} of ${t}`; occ.judgedAt=at; return log(`${p.name}: ${occLabel(p,key)} → Kept (${n} of ${t}).`); }
  if (excuseFor(p, key, 'approved')) { occ.outcome='excused'; occ.detail='Excused week'; occ.judgedAt=at; return log(`${p.name}: ${occLabel(p,key)} → Excused.`); }
  if (evFor(occ).some(e => e.status === 'pending')) { occ.detail='Week ended; photos still waiting for review'; return log(`${p.name}: ${occLabel(p,key)} ended with photos waiting for review.`); }
  missOcc(p, occ, at, `${n} of ${t}`, t - n); log(`${p.name}: ${occLabel(p,key)} → Missed (${n} of ${t}). ${t-n} × ${money(p.penalty)} penalty.`);
}
function advanceTo(target){
  for (let d = sod(S.now); d <= target; d = addDays(d,1)) {
    const noon = new Date(d); noon.setHours(12,0,0,0);
    const end = eod(d);
    if (noon > S.now && noon <= target) S.pacts.filter(p => p.stage==='active' && p.evidence==='oura').forEach(p => { const k = iso(addDays(d,-1)); if (scheduledOn(p, addDays(d,-1))) judgeNight(p, k, noon); });
    if (end > S.now && end <= target) S.pacts.filter(p => p.stage==='active' && p.evidence==='photo').forEach(p => {
      if (p.schedule.kind === 'fixed' && scheduledOn(p, d)) judgeDay(p, iso(d), end);
      if (p.schedule.kind === 'weekly' && d.getDay() === 0 && (!p.start || iso(weekStart(d)) >= p.start)) judgeWeek(p, iso(weekStart(d)), end);
      if (p.schedule.kind === 'once' && p.schedule.deadline === iso(d)) judgeDay(p, p.schedule.deadline, end);
      if (p.end && iso(d) === p.end) { p.stage = 'ended'; log(`${p.name} reached its end date → Ended.`); }
    });
  }
  const before = overdueTotal(S.me);
  S.now = target;
  const after = overdueTotal(S.me);
  if (after > before) log(`You are now ${money(after)} overdue. Sam gets notified.`);
}

function ledger(owner, recipientId){
  const pens = S.penalties.filter(x => x.owner === owner && x.recipientId === recipientId && x.status !== 'removed').sort((a,b) => a.addedAt - b.addedAt);
  const owedPens = pens.filter(x => x.status === 'owed');
  const pays = S.payments.filter(x => x.owner === owner && x.recipientId === recipientId);
  const paid = pays.filter(x => x.status === 'approved').reduce((a,x) => a + x.amount, 0);
  const pending = pays.filter(x => x.status === 'pending').reduce((a,x) => a + x.amount, 0);
  const held = pens.filter(x => x.status === 'held').reduce((a,x) => a + x.amount, 0);
  const added = owedPens.reduce((a,x) => a + x.amount, 0);
  let left = paid, overdue = 0;
  for (const x of owedPens) { const cover = Math.min(left, x.amount); left -= cover; if (x.dueAt <= S.now) overdue += x.amount - cover; }
  const owed = added - paid;
  return {pens, pays, paid, pending, held, added, owed, shown:owed - pending, overdue};
}
function ledgersOf(owner){
  const ids = new Set([...S.pacts.filter(p => p.owner === owner).map(p => p.recipientId), ...S.penalties.filter(x => x.owner === owner).map(x => x.recipientId)]);
  return [...ids].map(id => ({r:rcp(id), l:ledger(owner, id)}));
}
const overdueTotal = owner => ledgersOf(owner).reduce((a,x) => a + x.l.overdue, 0);

/* review items */
const KIND = {pact:'New pact', change:'Change request', evidence:'Evidence', excuse:'Excuse', payment:'Payment'};
function allItems(){
  const out = [];
  S.pacts.filter(p => p.stage === 'draft' && p.sent).forEach(p => out.push({kind:'pact', id:p.id, obj:p, owner:p.owner, pacts:[p], at:p.sentAt}));
  S.changes.filter(c => c.status === 'pending').forEach(c => { const p = pact(c.pactId); out.push({kind:'change', id:c.id, obj:c, owner:p.owner, pacts:[p], at:c.at}); });
  S.evidence.filter(e => e.status === 'pending').forEach(e => { const p = pact(e.pactId); out.push({kind:'evidence', id:e.id, obj:e, owner:p.owner, pacts:[p], at:e.receivedAt}); });
  S.excuses.filter(x => x.status === 'pending').forEach(x => out.push({kind:'excuse', id:x.id, obj:x, owner:x.owner, pacts:x.pactIds.map(pact), at:x.at}));
  S.payments.filter(x => x.status === 'pending').forEach(x => out.push({kind:'payment', id:x.id, obj:x, owner:x.owner, pacts:S.pacts.filter(p => p.owner === x.owner && p.recipientId === x.recipientId), at:x.at}));
  return out;
}
const prio = i => (i.kind === 'pact' || i.kind === 'change') ? 0 : 1;
const queueFor = acc => allItems().filter(i => i.owner !== acc && i.pacts.some(p => p.reviewers.includes(acc))).sort((a,b) => (prio(a) - prio(b)) || (a.at - b.at));
const keyOf = i => `${i.kind}:${i.id}`;
function itemByKey(key){
  const [kind, id] = key.split(':');
  const coll = {pact:S.pacts, change:S.changes, evidence:S.evidence, excuse:S.excuses, payment:S.payments}[kind];
  const obj = coll.find(x => x.id === id); if (!obj) return null;
  const owner = obj.owner;
  const pacts = kind === 'pact' ? [obj] : kind === 'excuse' ? obj.pactIds.map(pact) : kind === 'payment' ? S.pacts.filter(p => p.owner === owner && p.recipientId === obj.recipientId) : [pact(obj.pactId)];
  const at = kind === 'pact' ? obj.sentAt : kind === 'evidence' ? obj.receivedAt : obj.at;
  return {kind, id, obj, owner, pacts, at};
}
const isPendingItem = i => i.kind === 'pact' ? (i.obj.stage === 'draft' && i.obj.sent) : i.obj.status === 'pending';
function itemTitle(i){
  const o = i.obj, p = i.pacts[0];
  if (i.kind === 'pact') return o.name;
  if (i.kind === 'change') return p.name;
  if (i.kind === 'evidence') return p.name;
  if (i.kind === 'excuse') return i.pacts.map(x => x.name).join(', ');
  return `${money(o.amount)} to ${rcp(o.recipientId).name}`;
}
function itemSub(i){
  const o = i.obj, p = i.pacts[0];
  if (i.kind === 'pact') return 'Approve to make it Active';
  if (i.kind === 'change') return changeSummary(o);
  if (i.kind === 'evidence') return p.schedule.kind === 'weekly' ? `${fmtDay(parseIso(o.day))} · counts toward week of ${fmtDate(parseIso(occById(o.occId).key))}` : occLabel(p, occById(o.occId).key);
  if (i.kind === 'excuse') return o.from === o.to ? fmtDay(parseIso(o.from)) : `${fmtDate(parseIso(o.from))} – ${fmtDate(parseIso(o.to))}`;
  return o.note || 'Payment proof';
}
const occById = id => S.occurrences.find(o => o.id === id);
function age(at){ const h = Math.max(0, (S.now - at) / HOUR); return h < 1 ? `${Math.round(h*60)}m` : h < 48 ? `${Math.round(h)}h` : `${Math.round(h/24)}d`; }
function changeSummary(c){
  const parts = [];
  if ('penalty' in c.after) parts.push(`Penalty ${money(c.before.penalty)} → ${money(c.after.penalty)}`);
  if ('days' in c.after) parts.push(`Days ${daysText(c.before.days)} → ${daysText(c.after.days)}`);
  if (c.after.end) parts.push('End this pact');
  return parts.join(' · ');
}
const daysText = ds => ds.length === 7 ? 'every day' : [1,2,3,4,5,6,0].filter(d => ds.includes(d)).map(d => WD[d]).join(', ');

function decide(key, verdict, reason){
  const i = itemByKey(key); if (!i || !isPendingItem(i)) return;
  const o = i.obj, by = S.me, who = nameOf(by);
  if (i.kind === 'pact') {
    o.sent = false;
    if (verdict === 'approve') {
      const first = o.schedule.kind === 'weekly' ? iso(addDays(weekStart(S.now),7)) : iso(addDays(sod(S.now),1));
      o.start = o.start && o.start > first ? o.start : first; o.stage = 'active';
      log(`${who} approved "${o.name}". It is Active from ${fmtDay(parseIso(o.start))}.`);
    } else { o.rejectReason = reason; log(`${who} sent "${o.name}" back to Draft: "${reason}"`); }
  }
  if (i.kind === 'change') {
    const p = pact(o.pactId); o.status = verdict === 'approve' ? 'approved' : 'rejected';
    if (verdict === 'approve') { if (o.after.end) p.stage = 'ended'; const {end, ...rest} = o.after; if ('days' in rest) p.schedule.days = rest.days; if ('penalty' in rest) p.penalty = rest.penalty; log(`${who} approved the change to "${p.name}": ${changeSummary(o)}.`); }
    else { o.reason2 = reason; log(`${who} rejected the change to "${p.name}". Old terms stay.`); }
  }
  if (i.kind === 'evidence') {
    const p = pact(o.pactId), occ = occById(o.occId);
    o.status = verdict === 'approve' ? 'approved' : 'rejected'; o.decidedBy = by; o.decidedAt = new Date(S.now);
    if (verdict === 'approve') {
      if (p.schedule.kind === 'weekly') { const n = weekCount(occ); occ.detail = `${n} of ${p.schedule.target}`; if (n >= p.schedule.target && occ.outcome === 'pending') { occ.outcome = 'kept'; occ.judgedAt = new Date(S.now); } }
      else if (occ.outcome === 'pending') { occ.outcome = 'kept'; occ.detail = `Photo approved by ${who}`; occ.judgedAt = new Date(S.now); }
      log(`${who} approved the photo for "${p.name}" (${occLabel(p, occ.key)}).`);
    } else {
      o.reason = reason;
      const windowOver = p.schedule.kind === 'fixed' ? occ.key < todayKey() : p.schedule.kind === 'once' ? occ.key < todayKey() : false;
      if (windowOver && occ.outcome === 'pending') { missOcc(p, occ, S.now, 'Photo rejected'); log(`${who} rejected the photo for "${p.name}" → Missed. ${money(p.penalty)} penalty; 48h to file an excuse.`); }
      else log(`${who} rejected the photo for "${p.name}". The window is still open, so it can be resubmitted.`);
    }
  }
  if (i.kind === 'excuse') {
    o.status = verdict === 'approve' ? 'approved' : 'rejected';
    for (const p of i.pacts) for (const occ of S.occurrences.filter(oc => oc.pactId === p.id && covers(o, p, oc.key))) {
      for (const pen of penaltiesOf(occ)) pen.status = verdict === 'approve' ? 'removed' : (pen.status === 'held' ? 'owed' : pen.status);
      if (verdict === 'approve' && (occ.outcome === 'missed' || occ.outcome === 'pending')) { occ.outcome = 'excused'; occ.detail = 'Excused: ' + o.reason.slice(0,40); }
    }
    if (verdict === 'reject') o.reason2 = reason;
    log(verdict === 'approve' ? `${who} approved the excuse. Covered occurrences are Excused and their penalties removed.` : `${who} rejected the excuse: "${reason}". Held penalties are now owed.`);
  }
  if (i.kind === 'payment') {
    o.status = verdict === 'approve' ? 'approved' : 'rejected'; if (verdict === 'reject') o.reason2 = reason;
    log(verdict === 'approve' ? `${who} approved a ${money(o.amount)} payment to ${rcp(o.recipientId).name}.` : `${who} rejected the ${money(o.amount)} payment: "${reason}". It goes back on the balance.`);
  }
  S.form.rejecting = null; S.tmp.reason = '';
}
function comment(key, text){
  const i = itemByKey(key); if (!i || !text.trim()) return;
  i.obj.thread.push({by:S.me, text:text.trim(), at:new Date(S.now)});
  log(`${nameOf(S.me)} commented on ${KIND[i.kind].toLowerCase()} "${itemTitle(i)}".`);
  S.tmp.comment = ''; S.form.commenting = null;
}

/* alerts for the signed-in account */
function alertsFor(me){
  const out = [];
  if (!S.ouraOk && S.pacts.some(p => p.owner === me && p.evidence === 'oura' && p.stage === 'active')) out.push({tone:'bad', html:`<b>Oura is disconnected.</b> Nights without data count as Missed. Reconnect to stop that.`, actions:`<button class="btn sm" data-act="oura" data-arg="on">Reconnect Oura</button>`});
  for (const e of S.evidence.filter(e => e.owner === me && e.status === 'rejected' && !e.ack)) {
    const p = pact(e.pactId), occ = occById(e.occId);
    out.push({tone:'bad', html:`<b>${nameOf(e.decidedBy)} rejected your photo</b> for ${esc(p.name)} (${occLabel(p, occ.key)}): “${esc(e.reason)}”`, actions:`<button class="btn sm" data-act="openItem" data-arg="evidence:${e.id}">View</button><button class="btn sm" data-act="excuse" data-arg="${p.id}|${occ.key}">File excuse</button><button class="btn sm" data-act="ack" data-arg="${e.id}">Dismiss</button>`});
  }
  for (const p of S.pacts.filter(p => p.owner === me && p.stage === 'draft' && p.rejectReason && !p.sent)) out.push({tone:'warn', html:`<b>${esc(p.name)} came back as a Draft.</b> “${esc(p.rejectReason)}”`, actions:`<button class="btn sm" data-act="openPact" data-arg="${p.id}">Open draft</button>`});
  const mine = [...S.pacts.filter(p=>p.owner===me).map(p=>({kind:'pact',obj:p})), ...S.changes.filter(c=>c.owner===me).map(o=>({kind:'change',obj:o})), ...S.evidence.filter(e=>e.owner===me).map(o=>({kind:'evidence',obj:o})), ...S.excuses.filter(e=>e.owner===me).map(o=>({kind:'excuse',obj:o})), ...S.payments.filter(e=>e.owner===me).map(o=>({kind:'payment',obj:o}))];
  for (const m of mine) { const t = m.obj.thread; if (t && t.length && t[t.length-1].by !== me) out.push({tone:'info', html:`<b>${nameOf(t[t.length-1].by)} commented</b> on your ${KIND[m.kind].toLowerCase()}: “${esc(t[t.length-1].text)}”`, actions:`<button class="btn sm" data-act="openItem" data-arg="${m.kind}:${m.obj.id}">Reply</button>`}); }
  for (const {r, l} of ledgersOf(me)) if (l.overdue > 0) out.push({tone:'bad', html:`<b>${money(l.overdue)} overdue to ${esc(r.name)}.</b> ${l.pending ? `${money(l.pending)} payment waiting for approval.` : 'Penalties are due 7 days after they’re added.'}`, actions:`<button class="btn sm" data-act="pay" data-arg="${r.id}">Record payment</button>`});
  return out;
}

function screenKey(){

function readVariant(){

}

/* ---------- small renderers ---------- */
function outcomeChip(o){
  const map = {kept:['c-kept','Kept'], missed:['c-missed','Missed'], excused:['c-excused','Excused'], pending:['c-pending','Pending'], open:['c-open','Due today']};
  const [c, t] = map[o] || map.pending; return `<span class="chip ${c}">${t}</span>`;
}
function stageChip(p){
  if (p.stage === 'active') return `<span class="chip c-kept">Active</span>`;
  if (p.stage === 'ended') return `<span class="chip c-draft">Ended</span>`;
  return `<span class="chip c-draft">Draft${p.sent ? ' · waiting for ' + p.reviewers.map(nameOf).join(', ') : ''}</span>`;
}
function scheduleText(p){
  const s = p.schedule;
  if (s.kind === 'fixed') return s.days.length === 7 ? (p.evidence === 'oura' ? 'Every night' : 'Every day') : (p.evidence === 'oura' ? 'Nights: ' : '') + daysText(s.days);
  if (s.kind === 'weekly') return `${s.target}× per week (Mon–Sun)`;
  return `One-time, due ${fmtDay(parseIso(s.deadline))}`;
}
function termsList(p){
  const rows = [
    ['Evidence', p.evidence === 'oura' ? `Oura: in bed by ${fmtHM(p.bedtime)}` : 'Photo, checked by a reviewer'],
    ['Schedule', scheduleText(p)],

    p.end ? ['Ends', fmtDay(parseIso(p.end))] : null,

  ].filter(Boolean);
  return `<dl class="kv">${rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}
function photosGrid(photos){ return photos.length ? `<div class="photos">${photos.map(ph => `<img src="${ph.src}" alt="Submitted photo">`).join('')}</div>` : ''; }
function threadHtml(t){
  if (!t.length) return '';
  return `<div class="thread">${t.map(m => `<div class="msg ${m.by === S.me ? 'mine' : ''}"><small>${nameOf(m.by)} · ${fmtDay(m.at)} ${fmtTime(m.at)}</small>${esc(m.text)}</div>`).join('')}</div>`;
}
function heatmap(p){
  if (p.stage === 'draft') return `<p class="muted">The heat map starts once a reviewer approves this pact.</p>`;
  const today = sod(S.now);
  const legend = `<div class="legend"><span><i style="background:var(--kept)"></i>Kept</span><span><i style="background:var(--missed)"></i>Missed</span><span><i style="background:var(--excused)"></i>Excused</span><span><i style="background:var(--pending-bg);outline:1.5px solid var(--pending)"></i>Pending</span></div>`;
  if (p.schedule.kind === 'fixed') {
    let w0 = weekStart(parseIso(p.start)); const wEnd = weekStart(today);
    const weeks = []; for (let w = w0; w <= wEnd; w = addDays(w,7)) weeks.push(w);
    const shown = weeks.slice(-12);
    const labels = ['M','','W','','F','','S'].map(l => `<div class="c lbl">${l}</div>`).join('');
    const cells = shown.map(w => [0,1,2,3,4,5,6].map(i => {
      const d = addDays(w,i), k = iso(d);
      if (!scheduledOn(p, d)) return `<div class="c" title="${fmtDay(d)}: not scheduled"></div>`;
      if (d > today) return `<div class="c future" title="${fmtDay(d)}"></div>`;
      const o = findOcc(p, k); const cls = o ? (o.outcome === 'pending' && k === iso(today) ? 'open' : o.outcome) : (k === iso(today) ? 'open' : 'pending');
      return `<div class="c ${cls}" title="${occLabel(p,k)}: ${cls}${o?.detail ? ' · ' + esc(o.detail) : ''}"></div>`;
    }).join('')).join('');
    return `<div class="heat">${labels}${cells}</div>${legend}`;
  }
  if (p.schedule.kind === 'weekly') {
    const weeks = []; for (let w = weekStart(parseIso(p.start)); w <= weekStart(today); w = addDays(w,7)) weeks.push(w);
    return `<div class="heat weekly">${weeks.map(w => { const o = findOcc(p, iso(w)); const cls = o ? o.outcome : 'pending'; return `<div class="c ${cls}" title="Week of ${fmtDate(w)}: ${cls}"></div>`; }).join('')}</div>${legend}`;
  }
  const o = findOcc(p, p.schedule.deadline);
  return `<div class="row2">${outcomeChip(o ? o.outcome : 'pending')}<span class="muted">Due ${fmtDay(parseIso(p.schedule.deadline))}</span></div>`;
}

/* ---------- Today ---------- */
function photoCardBody(p){
  const today = sod(S.now);
  if (p.schedule.kind === 'fixed') {
    if (!scheduledOn(p, today)) {
      let n = addDays(today,1); for (let i = 0; i < 8 && !scheduledOn(p, n); i++) n = addDays(n,1);
      return `<div class="row2 muted">Not scheduled today. Next: ${fmtDay(n)}</div>`;
    }
  }
  if (p.schedule.kind === 'once' && (todayKey() < p.start || todayKey() > p.schedule.deadline)) return `<div class="muted">Opens ${fmtDay(parseIso(p.start))}</div>`;
  const occ = findOcc(p, occKey(p, today));
  const evs = occ ? evFor(occ) : [];
  const todays = evs.filter(e => e.day === todayKey());
  const pend = todays.find(e => e.status === 'pending'), appr = todays.find(e => e.status === 'approved'), rej = todays.find(e => e.status === 'rejected');
  let status = '';
  if (p.schedule.kind === 'weekly') {
    const n = occ ? weekCount(occ) : 0, t = p.schedule.target, waiting = evs.filter(e => e.status === 'pending').length;
    status = `<div class="spread"><div class="dots">${Array.from({length:t}, (_,i) => `<i class="${i < n ? 'on' : i < n + waiting ? 'wait' : ''}"></i>`).join('')}</div><span class="num">${n} of ${t} this week</span></div>`;
  }
  const dayLeft = `${Math.max(0, Math.floor((eod(S.now) - S.now) / HOUR))}h ${Math.floor(((eod(S.now) - S.now) % HOUR) / 6e4)}m left today`;
  if (appr && p.schedule.kind !== 'weekly') return `${status}<div class="row2">${outcomeChip('kept')}<span class="muted">Photo approved by ${nameOf(appr.decidedBy)}</span></div>`;
  if (pend) return `${status}<div class="row2">${outcomeChip('pending')}<span class="muted">Photo sent ${fmtTime(pend.receivedAt)}. Waiting for ${p.reviewers.map(nameOf).join(', ')}.</span></div>`;
  if (appr) return `${status}<div class="row2">${outcomeChip('kept')}<span class="muted">Today's photo approved</span></div>`;
  const rejNote = rej ? `<div class="muted">Your earlier photo was rejected: “${esc(rej.reason)}”. You can send another while the day is open.</div>` : '';
  const inline = S.variant === 'C' && S.form.inline === p.id;
  if (inline) return `${status}${rejNote}${evidenceInline(p)}`;
  return `${status}${rejNote}<div class="spread"><span class="chip c-open">Due today</span><span class="num muted" style="font-size:12.5px">${dayLeft}</span></div>
    <div class="row2"><button class="btn primary" data-act="evidence" data-arg="${p.id}">${S.variant === 'B' ? 'Take photo' : 'Submit photo'}</button><button class="btn" data-act="excuse" data-arg="${p.id}|${todayKey()}">File excuse</button></div>`;
}
function bedCardBody(p){
  const y = addDays(sod(S.now), -1), yk = iso(y);
  const occ = findOcc(p, yk);
  let last;
  if (!scheduledOn(p, y)) last = `<span class="muted">Last night wasn't scheduled.</span>`;
  else if (!occ || occ.outcome === 'pending') {
    const noon = new Date(sod(S.now)); noon.setHours(12);

  } else {
    last = `${outcomeChip(occ.outcome)}<span>${esc(occ.detail)}</span>`;
    if (occ.outcome === 'missed') {
      const x = excuseFor(p, yk, 'pending');

      last += x ? `<span class="muted">Excuse waiting for ${p.reviewers.map(nameOf).join(', ')}</span>` : left > 0 ? `<button class="link" data-act="excuse" data-arg="${p.id}|${yk}">File excuse · ${Math.floor(left)}h left</button>` : '';
    }
  }
  const olderMiss = S.occurrences.filter(o => o.pactId === p.id && o.outcome === 'missed' && o.key < yk && (S.now - o.judgedAt) / HOUR < 48 && !excuseFor(p, o.key, 'pending'));
  const pendX = S.excuses.filter(x => x.status === 'pending' && x.pactIds.includes(p.id) && x.to < yk);
  return `<div class="stack"><div class="label">Last night</div><div class="row2">${last}</div>
    ${pendX.map(x => `<div class="row2" style="font-size:13.5px">${outcomeChip('missed')}<span>Night of ${fmtDay(parseIso(x.from))}: excuse waiting for ${p.reviewers.map(nameOf).join(', ')}, ${money(p.penalty)} on hold</span></div>`).join('')}

    <div class="label">Tonight</div><div class="muted">In bed by ${fmtHM(p.bedtime)}${p.reminders.length ? ` · reminder at ${fmtHM(p.reminders[0].time)}` : ''}</div></div>`;
}
function renderToday(){

  return `${alerts}${empty}${cards}

}

function excusePreview(){
  const t = S.tmp; if (!t.from || !t.to || t.to < t.from) return {rows:[], ok:false};
  const rows = [];
  for (const pid of t.pactIds || []) {
    const p = pact(pid); if (!p || p.stage !== 'active') continue;
    const seen = new Set();
    for (let d = parseIso(t.from), n = 0; iso(d) <= t.to && n < 62; d = addDays(d,1), n++) {
      let key;
      if (p.schedule.kind === 'weekly') key = iso(weekStart(d));
      else if (p.schedule.kind === 'once') { if (iso(d) !== p.schedule.deadline) continue; key = p.schedule.deadline; }
      else { if (!scheduledOn(p, d)) continue; key = iso(d); }
      if (seen.has(key)) continue; seen.add(key);
      const o = findOcc(p, key);
      let note, ok = true;
      if (!o || o.outcome === 'pending') note = key >= todayKey() || p.schedule.kind === 'weekly' ? 'Not judged yet → Excused if approved' : 'Waiting to be judged → Excused if approved';
      else if (o.outcome === 'kept') { note = 'Already Kept'; ok = false; }
      else if (o.outcome === 'excused') { note = 'Already Excused'; ok = false; }
      else { const h = (S.now - o.judgedAt) / HOUR; if (h > 48) { note = 'Missed over 48h ago. Too late to excuse'; ok = false; } else note = `Missed → penalty held while pending`; }
      rows.push({p, key, note, ok});
    }
  }
  return {rows, ok: rows.some(r => r.ok) && (t.reason || '').trim().length > 0};
}

function submitChange(pid){

  if (!relax && !stricter) { S.sheet = null; return; }

}

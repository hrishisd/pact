  return `${name}<label class="field"><span>What will your photo show?</span><textarea class="inp" id="c-desc" data-f="desc" placeholder="e.g. Me at the gym with the equipment visible">${esc(d.desc)}</textarea><small>Your reviewer sees this when checking the evidence.</small></label>`; }
function fSchedule(){ const d = S.draft; return `<div class="stack">
  ${d.evidence === 'oura' ? `<div class="field"><span>Which nights?</span></div>` : `<div class="seg" role="group" aria-label="Schedule type">${[['fixed','Fixed days'],['weekly','Weekly count'],['once','One-time']].map(([k,l]) => `<button aria-pressed="${d.kind === k}" data-act="cset" data-arg="kind=${k}">${l}</button>`).join('')}</div>`}
  ${d.kind === 'fixed' ? `<div class="days">${[1,2,3,4,5,6,0].map(x => `<button aria-pressed="${d.days.includes(x)}" data-act="cday" data-arg="${x}">${WD[x].slice(0,2)}</button>`).join('')}</div>` : ''}
  ${d.kind === 'weekly' ? `<div class="row2"><button class="iconbtn" data-act="ctarget" data-arg="-1">−</button><b class="num" style="font-size:20px">${d.target}×</b><span>per week (Mon–Sun)</span><button class="iconbtn" data-act="ctarget" data-arg="1">+</button></div><small class="muted">One penalty for each session you're short.</small>` : ''}
  ${d.kind === 'once' ? `<label class="field"><span>Deadline</span><input class="inp" type="date" id="c-deadline" data-f="deadline" value="${d.deadline}"></label>` : ''}
  ${d.evidence === 'photo' ? `<label class="row2"><input type="checkbox" data-act="cwin" ${d.byOn ? 'checked' : ''}> Evidence is due by a set time</label>${d.byOn ? `<div class="row2" style="flex-wrap:nowrap"><span>Due by</span><input class="inp" type="time" id="c-by" data-f="byTime" value="${d.byTime}" style="max-width:160px"></div>` : ''}<small class="muted">${d.kind === 'fixed' ? 'You can submit on scheduled days only' : d.kind === 'weekly' ? 'You can submit on any day of the week' : 'You can submit any day from the start until the deadline'}, until ${d.byOn ? fmtHM(d.byTime) : 'midnight'}${d.kind === 'once' ? ' on the deadline day' : ''}.</small>` : ''}
  <div class="row2" style="flex-wrap:nowrap"><label class="field" style="flex:1"><span>Start (optional)</span><input class="inp" type="date" id="c-start" data-f="start" value="${d.start}"></label>${d.kind !== 'once' ? `<label class="field" style="flex:1"><span>End (optional)</span><input class="inp" type="date" id="c-end" data-f="end" value="${d.end}"></label>` : ''}</div>
  <small class="muted">${d.kind === 'weekly' ? 'It starts the Monday after you create it' : d.kind === 'once' ? 'The deadline must be at least an hour after you create it' : `It starts with the first ${d.evidence === 'oura' ? 'night' : 'day'} that's due at least an hour after you create it`}${d.kind === 'once' ? '' : ', or on the start date if that’s later'}.</small></div>`; }
function fStakes(){ const d = S.draft; return `<div class="stack">
  <label class="field"><span>Penalty per miss</span><div class="row2" style="flex-wrap:nowrap"><b style="font-size:20px">$</b><input class="inp num" type="number" min="1" id="c-pen" data-f="penalty" data-num value="${d.penalty}"></div></label>
  <div class="field"><span>Where the money goes</span>${myRecipients().map(r => `<button class="opt" aria-pressed="${d.recipientId === r.id}" data-act="cset" data-arg="recipientId=${r.id}"><span class="glyph">${r.kind === 'org' ? 'Org' : esc(r.name[0])}</span><span><b>${esc(r.name)}</b><small>${r.kind === 'org' ? esc(r.link) : 'A friend'}</small></span></button>`).join('')}
  <details><summary class="link" style="cursor:pointer">Add an organization</summary><div class="stack" style="margin-top:8px"><input class="inp" id="c-org" data-f="newOrg" placeholder="Organization name" value="${esc(d.newOrg)}"><input class="inp" id="c-orgl" data-f="newOrgLink" placeholder="Link (donation page)" value="${esc(d.newOrgLink)}"><button class="btn sm" data-act="addOrg">Add</button></div></details></div></div>`; }
function fReviewers(){ const d = S.draft; return `<div class="stack">${friendsOf(S.me).map(f => `<label class="opt" style="align-items:center"><input type="checkbox" data-act="crev" data-arg="${f}" ${d.reviewers.includes(f) ? 'checked' : ''}><span class="avatar" style="width:32px;height:32px">${acct(f).initial}</span><span><b>${acct(f).name}</b><small>${d.evidence === 'oura' ? 'Reviews excuses, payments and changes' : 'Reviews photos, excuses, payments and changes'}</small></span></label>`).join('')}<small class="muted">${d.evidence === 'oura' ? 'Any reviewer you pick can review your excuses and payments. There are no photos to review, because the app checks your ring.' : 'Any reviewer you pick can review your photos, excuses and payments.'} They’re notified once the 10-minute edit window closes.</small></div>`; }
function fReminders(){ const d = S.draft; return `<div class="stack">${d.reminders.map((r,i) => d.kind === 'once' && d.evidence === 'photo' ? `<div class="stack" style="gap:6px"><div class="row2" style="flex-wrap:nowrap"><input class="inp" type="date" id="c-rd${i}" data-f="reminders.${i}.date" value="${r.date || d.deadline}"><input class="inp" type="time" id="c-rt${i}" data-f="reminders.${i}.time" value="${r.time}"></div><div class="row2" style="flex-wrap:nowrap"><select class="inp" id="c-rc${i}" data-f="reminders.${i}.channel">${['Push','Email','Push + email'].map(c => `<option ${c === r.channel ? 'selected' : ''}>${c}</option>`).join('')}</select><button class="iconbtn" data-act="crem" data-arg="${i}" aria-label="Remove reminder">×</button></div></div>` : `<div class="row2" style="flex-wrap:nowrap"><input class="inp" type="time" id="c-rt${i}" data-f="reminders.${i}.time" value="${r.time}"><select class="inp" id="c-rc${i}" data-f="reminders.${i}.channel">${['Push','Email','Push + email'].map(c => `<option ${c === r.channel ? 'selected' : ''}>${c}</option>`).join('')}</select><button class="iconbtn" data-act="crem" data-arg="${i}" aria-label="Remove reminder">×</button></div>`).join('')}
  <button class="btn sm" data-act="cremadd" style="align-self:flex-start">Add reminder</button>
  <small class="muted">${d.evidence === 'oura' ? 'This reminder goes off every scheduled night, even if you’re already in bed. The app can’t tell until your ring syncs, usually the next morning.' : d.kind === 'weekly' ? 'Fires every day you haven’t submitted evidence, until the week’s target is met.' : d.kind === 'once' ? 'Each reminder goes off once, on its date and time, unless you’ve already submitted evidence.' : 'Fires on scheduled days, only if you haven’t submitted evidence yet.'}</small></div>`; }
const FIELDS = {source:['How will you prove it?', fSource], goal:['Goal', fGoal], schedule:['Schedule', fSchedule], stakes:['Penalty', fStakes], reviewers:['Reviewers', fReviewers], reminders:['Reminders', fReminders]};
function draftToPact(d){
  return {name:d.name.trim() || 'Untitled pact', desc:d.desc, evidence:d.evidence, schedule:d.kind === 'fixed' ? {kind:'fixed', days:[...d.days]} : d.kind === 'weekly' ? {kind:'weekly', target:d.target} : {kind:'once', deadline:d.deadline},
    bedtime:d.bedtime, by:d.byOn && d.evidence === 'photo' ? d.byTime : null, penalty:Number(d.penalty) || 1, recipientId:d.recipientId, reviewers:[...d.reviewers], reminders:d.reminders.map(r => d.kind === 'once' ? {...r, date:r.date || d.deadline} : {time:r.time, channel:r.channel}), startWanted:d.start, end:d.end};
}
function draftProblems(d){
  const out = [];
  if (!d.name.trim()) out.push('Give it a name');
  if (d.kind === 'fixed' && !d.days.length) out.push('Pick at least one day');
  if (!(Number(d.penalty) > 0)) out.push('Set a penalty');
  if (!d.reviewers.length) out.push('Pick a reviewer');
  if (d.evidence === 'oura' && !ouraOk(S.me)) out.push('Reconnect Oura');
  if (d.kind === 'once' && d.evidence === 'photo' && dueAt(draftToPact(d), parseIso(d.deadline)) - (d.editing ? pact(d.editing).createdAt : S.now) < LEAD_MS) out.push('Set a deadline at least an hour away');
  return out;
}
// Creating makes the pact Active at once. Saving an edit only works inside the 10-minute window.
function savePact(){
  const d = S.draft, probs = draftProblems(d);
  if (probs.length) { toast(probs[0]); return; }
  const data = draftToPact(d);
  let p;
  if (d.editing) {
    p = pact(d.editing);
    if (!inWindow(p)) { toast('The 10 minutes are up. Request a change instead.'); return; }
    Object.assign(p, data); p.start = firstStart(p, p.createdAt);
    log(`${nameOf(S.me)} edited "${p.name}" inside its edit window.`);
  } else {
    p = {id:nid('p'), owner:S.me, stage:'active', createdAt:new Date(S.now), thread:[], ...data};
    p.start = firstStart(p, p.createdAt); S.pacts.push(p);
    log(`${nameOf(S.me)} created "${p.name}". It's Active now; the first one is ${firstLabel(p)}. Free to edit or delete for 10 minutes; ${p.reviewers.map(nameOf).join(', ')} hear${p.reviewers.length === 1 ? 's' : ''} about it after that.`);
  }
  S.draft = null; S.form = {}; S.tab = 'pacts'; S.stack = [{name:'pact', id:p.id}];
  toast(d.editing ? 'Changes saved' : 'Pact created');
}
// The evidence kind is fixed with the pact, so editing a new pact skips the source step.
const createSteps = () => S.draft?.editing ? ['goal','schedule','stakes','reviewers','reminders','check'] : ['source','goal','schedule','stakes','reviewers','reminders','check'];
function pickSource(k){
  const d = S.draft;
  d.evidence = k;
  if (k === 'oura') Object.assign(d, {kind:'fixed', days:[0,1,2,3,4,5,6], byOn:false, name:ouraAuto(d.bedtime), nameAuto:true, desc:'', penalty:2, reminders:[{time:'23:30', channel:'Push'}]});
  else if (d.nameAuto) Object.assign(d, {name:'', nameAuto:false});
  S.form.cstep = 1;
}
function renderCreate(){
  if (!S.draft) S.draft = newDraft();
  const d = S.draft;
  {
    const steps = createSteps();
    const i = S.form.cstep || 0, k = steps[i];
    let check = '';
    if (k === 'check') {
      const at = d.editing ? pact(d.editing).createdAt : S.now, pd = draftToPact(d); pd.start = firstStart(pd, at);
      const probs = draftProblems(d);
      check = `<h2>Check it over</h2><div class="card">${termsList(pd)}</div>${probs.map(x => `<div class="alert warn">${x}</div>`).join('')}
        ${probs.length ? '' : `<div class="alert fresh"><div>${d.editing ? 'Saving keeps it Active.' : 'It’s Active as soon as you create it.'} The first one is <b>${firstLabel(pd)}</b>.</div></div>`}
        <p class="muted" style="margin:0">${d.editing ? 'You can keep editing or delete it until 10 minutes after you created it.' : `For 10 minutes you can edit or delete it freely. After that, stricter changes apply at once and looser ones need ${d.reviewers.map(nameOf).join(' or ') || 'a reviewer'} to approve.`}</p>`;
    }
    const body = k === 'check' ? check : `<h2>${FIELDS[k][0]}</h2>${FIELDS[k][1]()}`;
    return `<div class="stack"><div class="steps">${steps.map((_,j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div><small class="muted">Step ${i+1} of ${steps.length}</small></div>${body}
      <div class="footbar">${i > 0 ? `<button class="btn" data-act="cstep" data-arg="-1">Back</button>` : `<button class="btn" data-act="back">Cancel</button>`}
      ${k === 'source' ? '' : k === 'check' ? `<button class="btn primary" style="flex:1" data-act="savePact">${d.editing ? 'Save changes' : 'Create pact'}</button>` : `<button class="btn primary" style="flex:1" data-act="cstep" data-arg="1">Next</button>`}</div>`;
  }
}

/* ---------- Pacts + pact page ---------- */
function renderPacts(){
  const mine = S.pacts.filter(p => p.owner === S.me);
  const grp = (label, ps) => ps.length ? `<section class="stack"><div class="label">${label}</div><div class="cards">${ps.map(p => `<button class="rowbtn${inWindow(p) ? ' fresh' : ''}" data-act="openPact" data-arg="${p.id}"><span class="rt"><b>${esc(p.name)}</b><small>${scheduleText(p)} · <span class="pen">${money(p.penalty)}</span></small></span>${stageChip(p)}</button>`).join('')}</div></section>` : '';
  const ended = mine.filter(p => p.stage === 'ended');
  return `<button class="btn primary" data-act="create">New pact</button>
    ${grp('Active', mine.filter(p => p.stage === 'active'))}
    ${ended.length ? `<details><summary class="label" style="cursor:pointer">Ended (${ended.length})</summary>${grp('', ended)}</details>` : ''}`;
}
function renderPact(id){
  const p = pact(id);
  const waiting = allItems().filter(i => i.pacts.includes(p) && i.owner === S.me);
  let actions = '';
  if (inWindow(p) && p.owner === S.me) { const n = minsLeft(p);
    actions = `<div class="alert fresh"><div><b>Free to edit or delete for ${n} more minute${n === 1 ? '' : 's'}.</b> Then ${p.reviewers.map(nameOf).join(', ')} get${p.reviewers.length === 1 ? 's' : ''} notified, and changes follow the usual rules: stricter ones apply at once, looser ones need approval.</div><div class="row2"><button class="btn sm" data-act="editPact" data-arg="${p.id}">Edit</button><button class="btn sm danger" data-act="deletePact" data-arg="${p.id}">Delete</button></div></div>`; }
  else if (p.stage === 'active') actions = `<div class="row2"><button class="btn" data-act="excuse" data-arg="${p.id}|${todayKey()}">File excuse</button><button class="btn" data-act="change" data-arg="${p.id}">Request change</button></div>`;
  return `<div class="row2">${stageChip(p)}<span class="muted">${esc(p.desc)}</span></div>
    ${actions}
    <section class="card"><h3>History</h3>${heatmap(p)}</section>
    ${waiting.length ? `<section class="stack"><div class="label">Waiting on ${p.reviewers.map(nameOf).join(', ')}</div><div class="cards">${waiting.map(i => `<button class="rowbtn" data-act="openItem" data-arg="${keyOf(i)}">${kindIcon(i)}<span class="rt"><b>${KIND[i.kind]}</b><small>${esc(itemSub(i))}</small></span><span class="age">${age(i.at)}</span></button>`).join('')}</div></section>` : ''}
    <section class="card"><h3>Terms</h3>${termsList(p)}</section>`;
}

/* ---------- Review (3 variants) ---------- */
function itemBody(i){
  const o = i.obj, p = i.pacts[0];
  if (i.kind === 'change') {
    const rows = Object.keys(o.after).map(k => k === 'end' ? `<tr><td>Status</td><td>Active</td><td><b>Ended</b></td></tr>` : `<tr><td>${k === 'penalty' ? 'Penalty' : 'Days'}</td><td>${k === 'penalty' ? money(o.before.penalty) : daysText(o.before.days)}</td><td><b>${k === 'penalty' ? money(o.after.penalty) : daysText(o.after.days)}</b></td></tr>`).join('');
    return `<div class="card"><h3>${esc(p.name)}</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><tr class="muted"><td></td><td>Now</td><td>Requested</td></tr>${rows}</table></div>${o.reason ? `<div>“${esc(o.reason)}”</div>` : ''}<div class="muted" style="font-size:13px">The pact keeps its current terms until someone approves.</div></div>`;
  }
  if (i.kind === 'evidence') {
    // Reviewers only judge the evidence against "what counts"; the app already enforced the window.
    return `<div class="card"><div class="spread"><h3>${esc(p.name)}</h3><span class="meta">${fmtDay(parseIso(o.day))}</span></div>
      <div><span class="label">What counts</span><div>${esc(p.desc)}</div></div>
      ${o.photos.map(x => `<img class="big-photo" src="${x.src}" alt="Evidence">`).join('')}</div>`;
  }
  if (i.kind === 'excuse') {
    const cov = [];
    for (const px of i.pacts) for (const occ of S.occurrences.filter(oc => oc.pactId === px.id && covers(o, px, oc.key))) cov.push(`<div class="row2" style="font-size:13.5px">${occChip(px, occ)}<span>${esc(px.name)} · ${occLabel(px, occ.key)}${penaltiesOf(occ).some(x => x.status === 'held') ? ` · ${money(penaltiesOf(occ).reduce((a,x)=>a+x.amount,0))} on hold` : ''}</span></div>`);
    return `<div class="card"><h3>${o.from === o.to ? fmtDay(parseIso(o.from)) : `${fmtDay(parseIso(o.from))} – ${fmtDay(parseIso(o.to))}`}</h3>
      <div style="font-size:16px">“${esc(o.reason)}”</div>${o.photos.map(x => `<img class="big-photo" src="${x.src}" alt="Excuse attachment">`).join('')}
      <div class="label">Covers</div>${cov.join('') || '<span class="muted">Future dates only. They’ll be Excused when they come up.</span>'}
      <div class="muted" style="font-size:13px">Filed ${fmtDay(o.at)} ${fmtTime(o.at)}</div></div>`;
  }
  const l = ledger(o.owner, o.recipientId);
  return `<div class="card"><h3>${money(o.amount)} to ${esc(rcp(o.recipientId).name)}</h3>${o.photos.map(x => `<img class="big-photo" src="${x.src}" alt="Payment screenshot">`).join('')}
    <dl class="kv"><dt>Note</dt><dd>${esc(o.note || '—')}</dd><dt>Owes</dt><dd class="num">${money(l.owed)}${l.overdue ? ` (${money(l.overdue)} overdue)` : ''}</dd><dt>Sent</dt><dd class="num">${fmtDay(o.at)} ${fmtTime(o.at)}</dd></dl>
    <div class="muted" style="font-size:13px">Approving reduces ${nameOf(o.owner)}'s balance to ${money(Math.max(0, l.owed - o.amount))}.</div></div>`;
}
function composer(key, isOwner){
  const rej = S.form.rejecting === key, com = S.form.commenting === key || isOwner;
  return `${rej ? `<label class="field"><span>Why are you rejecting it? (required)</span><textarea class="inp" id="rej-${key}" data-tmp="reason" placeholder="e.g. This looks like it's from last week">${esc(S.tmp.reason || '')}</textarea></label><div class="row2"><button class="btn" data-act="cancelRej">Cancel</button><button class="btn danger" data-act="confirmRej" data-arg="${key}" data-needs="reason" ${(S.tmp.reason || '').trim() ? '' : 'disabled'}>Reject</button></div>` : ''}
    ${com && !rej ? `<label class="field"><span>${isOwner ? 'Reply' : 'Comment'}</span><textarea class="inp" id="com-${key}" data-tmp="comment" placeholder="${isOwner ? 'Answer your reviewer' : 'Ask for more info'}">${esc(S.tmp.comment || '')}</textarea></label><div class="row2"><button class="btn primary" data-act="sendCom" data-arg="${key}" data-needs="comment" ${(S.tmp.comment || '').trim() ? '' : 'disabled'}>Send</button>${isOwner ? '' : '<button class="btn" data-act="cancelCom">Cancel</button>'}</div>` : ''}`;
}
function decisionText(i){
  const o = i.obj;
  if (o.status === 'approved') return `Approved${o.decidedBy ? ' by ' + nameOf(o.decidedBy) : ''}.`;
  if (o.status === 'rejected') return `Rejected: “${esc(o.reason || o.reason2 || '')}”`;
  return '';
}
function renderItemPage(key){
  const i = itemByKey(key); if (!i) return '<p>Gone.</p>';
  const isOwner = i.owner === S.me, pend = isPendingItem(i);
  const head = `<div class="row2">${kindBadge(i)}<span class="muted">from ${nameOf(i.owner)} · ${age(i.at)} ago</span></div>`;
  const decided = !pend ? `<div class="alert ${i.obj.status === 'rejected' ? 'bad' : 'info'}">${decisionText(i)}</div>` : '';
  const bar = !isOwner && pend && !S.form.rejecting && S.form.commenting !== key ? `<div class="footbar"><button class="btn danger" data-act="reject" data-arg="${key}">Reject</button><button class="btn" data-act="comment" data-arg="${key}">Comment</button><button class="btn ok" style="flex:1" data-act="approve" data-arg="${key}">Approve</button></div>` : '';
  return `${head}${decided}${itemBody(i)}${threadHtml(i.obj.thread)}${pend ? composer(key, isOwner) : ''}${isOwner && pend ? `<div class="muted" style="font-size:13px">Waiting for ${i.pacts[0].reviewers.map(nameOf).join(', ')} to decide.</div>` : ''}${bar}`;
}
function renderReview(){
  const q = queueFor(S.me);
  const asked = reviewsFor(S.me).filter(awaitingOwner);
  const askedNote = asked.length ? `<div class="cards">${asked.map(i => `<button class="rowbtn" data-act="openItem" data-arg="${keyOf(i)}"><span class="chip c-wait">Waiting for ${nameOf(i.owner)}</span><span class="rt"><b>${esc(itemTitle(i))}</b><small>You asked: “${esc(i.obj.thread[i.obj.thread.length-1].text)}”</small></span></button>`).join('')}</div>` : '';
  if (!q.length) return `<div class="card"><h3>Nothing to review</h3><p class="muted" style="margin:0">When ${friendsOf(S.me).map(nameOf).join(', ')} sends evidence, an excuse, a payment or a change, it shows up here.</p></div>${askedNote}${S.me === 'you' && !asked.length ? '<button class="btn" data-act="as" data-arg="sam">Switch to Sam to see their queue</button>' : ''}`;
  {
    const idx = Math.min(S.form.ridx || 0, q.length - 1), i = q[idx], key = keyOf(i);
    const busy = S.form.rejecting === key || S.form.commenting === key;
    return `<div class="spread"><span class="counter">${idx+1} of ${q.length} to review</span><div class="row2">${q.length > 1 ? `<button class="btn sm" data-act="rskip" data-arg="-1">‹ Prev</button><button class="btn sm" data-act="rskip" data-arg="1">Skip ›</button>` : ''}</div></div>
      <div class="row2">${kindBadge(i)}<span class="muted">from ${nameOf(i.owner)} · ${age(i.at)} ago</span></div>
      ${itemBody(i)}${threadHtml(i.obj.thread)}${composer(key, false)}
      ${busy ? '' : `<div class="decide"><button class="btn danger" data-act="reject" data-arg="${key}">Reject</button><button class="btn" data-act="comment" data-arg="${key}">Ask</button><button class="btn ok" data-act="approve" data-arg="${key}">Approve</button></div>`}
      ${asked.length ? `<div class="label">Waiting on a reply</div>${askedNote}` : ''}`;
  }
}

/* ---------- Ledgers ---------- */
// Owed, one status line only when there's something to say, and lifetime paid. Held penalties show in the history.
function ledgerSummary(r, l){
  const status = [l.overdue - l.pending > 0 ? `<b style="color:var(--missed)">${money(l.overdue - l.pending)} overdue</b>` : '', l.pending ? `${money(l.pending)} payment awaiting approval` : ''].filter(Boolean).join(' · ');
  return `<div class="sumrow"><div><div class="bigmoney">${money(Math.max(0, l.shown))}</div><div class="meta">owed</div>${status ? `<div class="meta">${status}</div>` : ''}</div>
      <button class="btn primary sm" data-act="pay" data-arg="${r.id}" ${l.shown > 0 ? '' : 'disabled'}>Record payment</button></div>
    <dl class="kv"><dt>Lifetime paid</dt><dd class="num">${money(l.paid)}</dd></dl>`;
}
const PAY_STATUS = {pending:'awaiting approval', approved:'approved', rejected:'rejected'};
function renderLedgers(){
  const ls = ledgersOf(S.me);
  if (!ls.length) return `<div class="card"><h3>No ledgers yet</h3><p class="muted" style="margin:0">Each recipient gets a ledger once a pact names them.</p></div>`;
  return ls.map(({r, l}) => `<article class="card tcard" data-act="openLedger" data-arg="${r.id}"><h3>${esc(r.name)}</h3>${ledgerSummary(r, l)}</article>`).join('')
    + `<p class="muted" style="font-size:13px;margin:0">Penalties are due 7 days after they’re added. Payments clear the oldest first.</p>`;
}
function renderLedger(id){
  const r = rcp(id), l = ledger(S.me, id);
  const hist = [...l.pens.map(x => ({at:x.addedAt, html:`<span class="rt"><b>${esc(pact(x.pactId).name)}</b><small>${occLabel(pact(x.pactId), occById(x.occId).key)}${x.status === 'held' ? ' · on hold while an excuse waits for approval' : x.dueAt <= S.now ? '' : ` · due ${fmtDate(x.dueAt)}`}</small></span><span class="num" style="color:var(--missed)">+${money(x.amount)}</span>`})),
                ...l.pays.map(x => ({at:x.at, html:`<span class="rt"><b>Payment</b><small>${esc(x.note || '')} · ${PAY_STATUS[x.status]}</small></span><span class="num" style="color:${x.status === 'approved' ? 'var(--kept)' : 'var(--muted)'}">${x.status === 'rejected' ? '' : '−'}${money(x.amount)}</span>`}))].sort((a,b) => b.at - a.at);
  return `<section class="card">${ledgerSummary(r, l)}</section>
    <section class="stack"><div class="label">History</div><div class="list">${hist.map(h => `<div class="rowbtn">${h.html}<span class="age">${fmtDate(h.at)}</span></div>`).join('') || '<div class="rowbtn muted">Nothing yet</div>'}</div></section>`;
}

/* ---------- side panel ---------- */
function renderSide(){
  const qs = Object.keys(S.accounts).map(a => `<tr><td>${acct(a).name}</td><td>${queueFor(a).length}</td><td>${money(ledgersOf(a).reduce((x,y) => x + Math.max(0,y.l.shown), 0))}</td><td>${money(overdueTotal(a))}</td></tr>`).join('');
  const recent = S.occurrences.filter(o => o.key >= iso(addDays(S.now,-3))).sort((a,b) => a.key < b.key ? 1 : -1).slice(0, 8)
    .map(o => { const p = pact(o.pactId); return `<tr><td>${esc(p.name)}</td><td>${occLabel(p, o.key).replace('Night of ','')}</td><td>${o.outcome === 'pending' ? 'not judged' : o.outcome}</td></tr>`; }).join('');
  $('#side').innerHTML = `<div class="spread"><span class="tag">PROTOTYPE · THROWAWAY</span><button class="btn sm closeside" data-act="side">Close</button></div>
    <section><h2>Pact flows · round 6</h2><div class="muted" style="font-size:13.5px">New in this round: no Drafts and no approval for new pacts. A pact is Active as soon as you create it, and for 10 minutes it's blue and free to edit or delete ("Read 20 pages" is one). Its first occurrence needs an hour's lead time. Occurrences say what they're waiting for instead of "Pending", ledger cards are simpler, the current tab is easier to see, and the invite says you can pick each other as reviewers.</div></section>
    <section><div class="label">Signed in as</div><div class="seg">${Object.keys(S.accounts).map(a => `<button aria-pressed="${S.me === a}" data-act="as" data-arg="${a}">${acct(a).name}</button>`).join('')}</div><small class="muted">You own the bedtime and gym pacts and Sam reviews them. Sam owns a running pact that you review. Switch to act as the other person.</small></section>
    <section><div class="label">Jump to</div><div class="row2"><button class="btn sm" data-act="jump" data-arg="create">Create pact</button><button class="btn sm" data-act="jump" data-arg="review">Review</button><button class="btn sm" data-act="jump" data-arg="evidence">Submit evidence</button><button class="btn sm" data-act="jump" data-arg="ledgers">Ledgers</button></div>
      <table><tr><th>Screen</th><th>Design</th></tr>${Object.entries(CHOSEN).map(([k,v]) => `<tr><td>${SCREEN_NAME[k]}</td><td>${v} (chosen)</td></tr>`).join('')}</table></section>
    <section><div class="label">Clock</div><div class="num">${fmtDay(S.now)}, ${fmtTime(S.now)}</div><div class="row2"><button class="btn sm" data-act="advance5">Advance 5 minutes</button><button class="btn sm" data-act="advance">Advance to tomorrow, noon</button></div><small class="muted">Judges today's evidence pacts at the end of the day and last night's bedtime at noon. Penalties, overdue amounts, 48h excuse windows and 10-minute edit windows all follow the clock.</small>
      <label class="row2"><input type="checkbox" data-act="oura" ${S.oura.you === 'broken' ? 'checked' : ''}> Simulate your Oura connection dropping</label>
      <button class="btn sm" data-act="reset" style="align-self:flex-start">Reset everything</button></section>
    <section><div class="label">State</div><table><tr><th>Account</th><th>To review</th><th>Owes</th><th>Overdue</th></tr>${qs}</table>
      <table><tr><th>Pact</th><th>Occurrence</th><th>Outcome</th></tr>${recent}</table></section>
    <section><div class="label">What just happened</div><div class="log">${S.log.slice(0, 10).map(l => `<div><span class="muted">${fmtTime(l.at)}</span> ${esc(l.text)}</div>`).join('')}</div></section>
    <section><div class="label">Questions this prototype raised</div><ul>
      <li>After a reviewer asks a question, the item waits on the owner (an alert on their Today) and leaves the review queue until they reply. Is that the right home for it?</li></ul></section>`;
}
function renderSwitcher(){ $('#switcher').innerHTML = `<button class="ctl" data-act="side">Prototype controls</button>`; }

/* ---------- shell ---------- */
let toastMsg = null, toastTimer;
function toast(m){ toastMsg = m; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastMsg = null; render(); }, 2200); }
const scrollMemo = {};
function viewId(){ const t = S.stack[S.stack.length-1]; return t ? t.name + (t.id || t.key || '') : S.tab; }
function render(){
  const sc = $('.scroll'); if (sc) scrollMemo[render.last] = sc.scrollTop;
  const top = S.stack[S.stack.length-1];
  let html;
  if (top?.name === 'capture') html = renderCapture(top);
  else {
    let title, sub = '', body;
    if (top?.name === 'create') { title = S.draft?.editing ? 'Edit pact' : 'New pact'; body = renderCreate(); }
    else if (top?.name === 'invite') { title = 'Invite'; sub = 'What your friend sees'; body = renderInvite(); }
    else if (top?.name === 'connect') { title = 'Oura Ring'; sub = 'Connection'; body = renderConnect(); }
    else if (top?.name === 'ledger') { const r = rcp(top.id); title = r.name; sub = r.kind === 'org' ? esc(r.link) : 'Friend'; body = renderLedger(top.id); }
    else if (top?.name === 'pact') { const p = pact(top.id); title = p.name; sub = scheduleText(p); body = renderPact(top.id); }
    else if (top?.name === 'item') { const i = itemByKey(top.key); title = i ? KIND[i.kind] : 'Item'; sub = i ? esc(itemTitle(i)) : ''; body = renderItemPage(top.key); }
    else {
      const T = {today:['Today', fmtDay(S.now)], pacts:['Pacts', 'Yours'], review:['Review', `${queueFor(S.me).length} waiting on you`], ledgers:['Ledgers', '']};
      [title, sub] = T[S.tab]; body = {today:renderToday, pacts:renderPacts, review:renderReview, ledgers:renderLedgers}[S.tab]();
    }
    const q = queueFor(S.me).length;
    html = `<header class="hdr gut">${top ? `<button class="iconbtn" data-act="back" aria-label="Back">${IC.back}</button>` : ''}<h1>${esc(title)}<span class="sub">${sub}</span></h1><button class="avatar" data-act="profile" aria-label="Profile">${acct(S.me).initial}</button></header>
      <main class="scroll gut">${body}</main>
      <nav class="tabbar" aria-label="Main">${['today','pacts','review','ledgers'].map(t => `<button class="tab" data-act="tab" data-arg="${t}" ${S.tab === t ? `aria-current="${top ? 'true' : 'page'}"` : ''}><span class="pill">${IC[t]}</span>${t[0].toUpperCase() + t.slice(1)}${t === 'review' && q ? `<span class="badge">${q}</span>` : ''}</button>`).join('')}</nav>`;
  }
  if (S.sheet) {
    const k = S.sheet.kind;
    const inner = k === 'evidence' ? evidenceSheet(pact(S.sheet.pactId)) : k === 'excuse' ? excuseSheet() : k === 'pay' ? paySheet() : k === 'change' ? changeSheet(pact(S.sheet.pactId)) : profileSheet();
    html += `<div class="overlay" data-act="closeSheet"><div class="sheet gut" role="dialog" aria-modal="true" data-stop><div class="grab"></div>${inner}</div></div>`;
  }
  if (toastMsg) html += `<div style="position:absolute;left:50%;transform:translateX(-50%);top:70px;z-index:40;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13.5px">${esc(toastMsg)}</div>`;
  $('#app').innerHTML = html;
  const id = viewId(); const nsc = $('.scroll'); if (nsc && render.last === id && scrollMemo[id]) nsc.scrollTop = scrollMemo[id]; render.last = id;
  renderSide(); renderSwitcher();
  $('#side').classList.toggle('open', S.sideOpen);
}
function liveUpdate(){
  document.querySelectorAll('[data-needs]').forEach(b => b.disabled = !(S.tmp[b.dataset.needs] || '').trim());
  const ex = document.querySelector('[data-live-ok="excuse"]'); if (ex) ex.disabled = !excusePreview().ok;
}

/* ---------- actions ---------- */
const ACT = {
  tab:a => { S.tab = a; S.stack = []; S.form = {}; S.sheet = null; },
  back:() => { const t = S.stack.pop(); if (t?.name === 'create') S.draft = null; if (t?.name === 'capture') S.tmp = {}; S.form.rejecting = S.form.commenting = null; },
  profile:() => { S.tmp = {}; S.sheet = {kind:'profile'}; },
  closeSheet:(a, el, e) => { if (e.target === el) { S.sheet = null; S.tmp = {}; } else return 'skip'; },
  create:() => { S.draft = null; S.form = {}; S.stack.push({name:'create'}); },
  openPact:a => { if (S.stack.length && S.stack[S.stack.length-1].id === a) return; S.stack.push({name:'pact', id:a}); S.form = {}; }, // Back returns to wherever you came from
  openLedger:a => { S.stack = [{name:'ledger', id:a}]; S.tab = 'ledgers'; },
  openItem:a => { S.form = {}; S.tmp = {}; S.stack.push({name:'item', key:a}); },
  evidence:a => { S.tmp = {}; S.form.inline = a; },
  closeInline:() => { S.form.inline = null; S.tmp = {}; },
  sample:a => { (S.tmp.photos ||= []).push({src:PHOTO[a] || PHOTO.gym, taken:new Date(+S.now - 3*6e4)}); },
  retake:() => { S.tmp.photos = []; },
  submitEvidence:a => submitEvidence(a),
  excuse:a => { const [pid, key] = (a || '').split('|'); S.tmp = {pactIds:pid ? [pid] : [], from:key || todayKey(), to:key || todayKey(), photos:[]}; S.sheet = {kind:'excuse'}; },
  excuseFromCap:a => { S.stack.pop(); ACT.excuse(`${a}|${todayKey()}`); },
  exPact:(a, el) => { const s = new Set(S.tmp.pactIds || []); el.checked ? s.add(a) : s.delete(a); S.tmp.pactIds = [...s]; },
  submitExcuse:() => submitExcuse(),
  pay:a => { S.tmp = {recipientId:a, photos:[]}; S.sheet = {kind:'pay'}; },
  submitPay:() => submitPay(),
  change:a => { S.tmp = {}; S.sheet = {kind:'change', pactId:a}; },
  crDay:a => { const d = Number(a), s = new Set(S.tmp.days); s.has(d) ? s.delete(d) : s.add(d); S.tmp.days = [...s]; },
  crEnd:(a, el) => { S.tmp.end = el.checked; },
  submitChange:a => submitChange(a),
  approve:a => { decide(a, 'approve'); afterDecision(a); },
  reject:a => { S.form.rejecting = a; S.form.commenting = null; S.tmp.reason = ''; },
  cancelRej:() => { S.form.rejecting = null; },
  confirmRej:a => { if (!(S.tmp.reason || '').trim()) return; decide(a, 'reject', S.tmp.reason.trim()); afterDecision(a); },
  comment:a => { S.form.commenting = a; S.form.rejecting = null; S.tmp.comment = ''; },
  cancelCom:() => { S.form.commenting = null; },
  sendCom:a => { const i = itemByKey(a); comment(a, S.tmp.comment || '');
    if (i.owner !== S.me) { const n = queueFor(S.me).length; S.form = {ridx:Math.min(S.form.ridx || 0, Math.max(0, n - 1))}; toast(`Sent. It’s with ${nameOf(i.owner)} until they reply`); }
    else toast(`Reply sent. It’s back with ${i.pacts[0].reviewers.map(nameOf).join(', ')}`); },
  rskip:a => { const n = queueFor(S.me).length; S.form = {ridx:((S.form.ridx || 0) + Number(a) + n) % n}; },
  expand:a => { S.form.expanded = S.form.expanded === a ? null : a; },
  ack:a => { const e = S.evidence.find(x => x.id === a); if (e) e.ack = true; },
  // create
  cstep:a => { S.form.cstep = Math.max(0, Math.min(createSteps().length - 1, (S.form.cstep || 0) + Number(a))); },
  cset:a => { const [k, v] = a.split('='); S.draft[k] = v; },
  csource:a => {
    if (a === 'oura' && !ouraOk(S.me)) { S.stack.push({name:'connect', then:'oura'}); return; }
    pickSource(a);
  },
  connect:() => { S.sheet = null; S.tmp = {}; S.stack.push({name:'connect'}); },
  connected:() => { const t = S.stack.pop(); S.oura[S.me] = 'ok'; log(`${nameOf(S.me)} connected Oura.`); if (t?.then === 'oura') pickSource('oura'); else toast('Oura connected'); },
  disc:a => { if (a === 'ask') S.tmp.disc = true; else if (a === 'no') S.tmp.disc = false; else { S.oura[S.me] = null; S.tmp = {}; log(`${nameOf(S.me)} disconnected Oura. Nights on Oura pacts count as Missed until reconnected.`); toast('Oura disconnected'); } },
  cday:a => { const d = Number(a), s = new Set(S.draft.days); s.has(d) ? s.delete(d) : s.add(d); S.draft.days = [...s]; },
  ctarget:a => { S.draft.target = Math.max(1, Math.min(7, S.draft.target + Number(a))); },
  cwin:(a, el) => { S.draft.byOn = el.checked; },
  crev:(a, el) => { const s = new Set(S.draft.reviewers); el.checked ? s.add(a) : s.delete(a); S.draft.reviewers = [...s]; },
  crem:a => { S.draft.reminders.splice(Number(a), 1); },
  cremadd:() => { S.draft.reminders.push({time:'20:00', channel:'Push', ...(S.draft.kind === 'once' ? {date:S.draft.deadline} : {})}); },
  addOrg:() => { const d = S.draft; if (!d.newOrg.trim()) return; const r = {id:nid('rc'), owner:S.me, kind:'org', name:d.newOrg.trim(), link:d.newOrgLink.trim() || '—'}; S.recipients.push(r); d.recipientId = r.id; d.newOrg = d.newOrgLink = ''; log(`Added recipient "${r.name}".`); },
  savePact:() => savePact(),
  deletePact:a => { const p = pact(a); if (!inWindow(p)) { toast('The 10 minutes are up. Request a change instead.'); return; }
    S.pacts = S.pacts.filter(x => x !== p); S.occurrences = S.occurrences.filter(o => o.pactId !== a); S.evidence = S.evidence.filter(e => e.pactId !== a);
    S.stack = S.stack.filter(t => t.id !== a); log(`${nameOf(S.me)} deleted "${p.name}" inside its edit window. Nobody was notified.`); toast('Pact deleted'); },
  invitePreview:() => { S.sheet = null; S.tmp = {}; S.stack.push({name:'invite'}); },
  editPact:a => { const p = pact(a); if (!inWindow(p)) { toast('The 10 minutes are up. Request a change instead.'); return; } S.draft = {...newDraft(), name:p.name, desc:p.desc, evidence:p.evidence, kind:p.schedule.kind, days:p.schedule.days || [1,3,5], target:p.schedule.target || 3, deadline:p.schedule.deadline || iso(addDays(S.now,30)), bedtime:p.bedtime || '00:00', byOn:!!p.by, byTime:p.by || '09:00', start:p.startWanted || '', end:p.end || '', penalty:p.penalty, recipientId:p.recipientId, reviewers:[...p.reviewers], reminders:p.reminders.map(r => ({...r})), editing:p.id}; S.form = {tpl:'edit'}; S.stack.push({name:'create'}); },
  // prototype controls
  vprev:() => cycle(-1), vnext:() => cycle(1),
  side:() => { S.sideOpen = !S.sideOpen; },
  as:a => { S.me = a; S.stack = []; S.sheet = null; S.form = {}; S.tmp = {}; S.draft = null; S.sideOpen = false; log(`Now signed in as ${acct(a).name}.`); },
  jump:a => { S.sheet = null; S.form = {}; S.draft = null; S.sideOpen = false;
    if (a === 'create') { S.tab = 'pacts'; S.stack = [{name:'create'}]; }
    else if (a === 'review') { if (!queueFor(S.me).length && queueFor('sam').length) S.me = 'sam'; S.tab = 'review'; S.stack = []; }
    else if (a === 'evidence') { S.me = 'you'; S.tab = 'today'; S.stack = []; const p = S.pacts.find(x => x.owner === 'you' && x.evidence === 'photo' && x.stage === 'active' && scheduledOn(x, S.now)); if (p) ACT.evidence(p.id); else toast('No photo pact due today. Advance the clock.'); }
    else { S.tab = a; S.stack = []; } },
  advance:() => { const t = addDays(sod(S.now), 1); t.setHours(12,0,0,0); advanceTo(t); S.sheet = null; },
  advance5:() => { advanceTo(new Date(+S.now + 5*6e4)); },
  oura:() => { if (!S.oura.you) { toast('Connect Oura as You first'); return; } S.oura.you = S.oura.you === 'ok' ? 'broken' : 'ok'; log(S.oura.you === 'ok' ? 'Oura reconnected.' : 'Oura connection dropped (simulated). You get an alert and a push notification.'); },
  reset:() => { const v = S.variant; S = seed(); S.variant = v; },
  invite:() => { S.tmp.invite = true; },
  copy:() => { try { navigator.clipboard.writeText('pact.app/i/7Kq2xV').then(() => toast('Link copied'), () => toast('Select the link to copy it')); } catch(e) { toast('Select the link to copy it'); } return 'skip'; },
  hist:a => { S.form['hist-' + a] = !S.form['hist-' + a]; },
};
function afterDecision(key){
  const top = S.stack[S.stack.length-1];
  if (top?.name === 'item' && top.key === key) S.stack.pop();
  const q = queueFor(S.me).length;
  S.form = {ridx:Math.min(S.form.ridx || 0, Math.max(0, q - 1))};
  toast(q ? `Done. ${q} left` : 'Queue cleared');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // handled on change
  if (el.closest('[data-stop]') && el.dataset.act === 'closeSheet') return;
  const ctl = e.target.closest('input,textarea,select,label,summary'); if (ctl && ctl !== el && el.contains(ctl)) return; // form controls inside a clickable card
  const r = ACT[el.dataset.act]?.(el.dataset.arg, el, e);
  if (r !== 'skip') render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.file !== undefined && t.files?.length) {
    const files = [...t.files]; let n = files.length;
    for (const f of files) { const rd = new FileReader(); rd.onload = () => { (S.tmp.photos ||= []).push({src:rd.result, taken:new Date(f.lastModified)}); if (--n === 0) render(); }; rd.readAsDataURL(f); }
    return;
  }
  if (t.type === 'checkbox' && t.dataset.act) { ACT[t.dataset.act]?.(t.dataset.arg, t, e); render(); return; }
  if (t.dataset.f !== undefined) { setField(t); if (t.tagName === 'SELECT') render(); return; }
  if (t.dataset.tmp !== undefined) { S.tmp[t.dataset.tmp] = t.value; if (t.dataset.rerender !== undefined) render(); else liveUpdate(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f !== undefined) { setField(t);
    if (t.dataset.f === 'name') S.draft.nameAuto = false;
    if (t.dataset.f === 'bedtime' && S.draft.nameAuto) { S.draft.name = ouraAuto(t.value); const n = document.getElementById('c-name'); if (n) n.value = S.draft.name; }
    liveUpdate(); }
  else if (t.dataset.tmp !== undefined && t.dataset.rerender === undefined) { S.tmp[t.dataset.tmp] = t.value; liveUpdate(); }
});
function setField(t){
  const path = t.dataset.f.split('.'); let o = S.draft;
  for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length-1]] = t.dataset.num !== undefined ? Number(t.value) : t.value;
}
window.addEventListener('hashchange', () => { const v = readVariant(); if (v !== S.variant) setVariant(v); });

S = seed(); S.variant = readVariant(); render();
</script>

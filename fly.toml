# Fly.io: one always-on machine in ewr with the /data volume (ADR 0002).
# Secrets (set with `fly secrets set`, see scripts/setup-operator.sh):
#   OPERATOR_EMAIL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, BETTER_AUTH_SECRET,
#   LITESTREAM_BUCKET, LITESTREAM_ENDPOINT, LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY

app = "pact"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  PACT_DB_PATH = "/data/pact.db"
  BETTER_AUTH_URL = "https://pact.hrishisd.com"

[[mounts]]
  source = "pact_data"
  destination = "/data"
  # Fly's daily volume snapshots stay on as a backstop behind Litestream.
  snapshot_retention = 5

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # No Fly health check on /health: with one machine, a failing check would
  # take the whole app offline when only the scheduler is stuck. An external
  # uptime monitor watches /health and emails the operator instead (ADR 0002).

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

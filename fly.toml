# Fly.io: one always-on machine in ewr with the /data volume (ADR 0002).
# Secrets (set with `fly secrets set`, see scripts/setup-operator.sh):
#   OPERATOR_EMAIL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, BETTER_AUTH_SECRET,
#   LITESTREAM_BUCKET, LITESTREAM_ENDPOINT, LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY,
#   PHOTOS_BUCKET, PHOTOS_ENDPOINT, PHOTOS_ACCESS_KEY_ID, PHOTOS_SECRET_ACCESS_KEY,
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, GMAIL_ADDRESS, GMAIL_APP_PASSWORD
# Optional secrets (see .env.example): OURA_CLIENT_ID with OURA_CLIENT_SECRET and
# OURA_TOKEN_KEY, all three or none; ANKI_TOKEN_KEY.

app = "pact-hrishisd"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  PACT_DB_PATH = "/data/pact.db"
  BETTER_AUTH_URL = "https://pact.hrishisd.com"

[[mounts]]
  source = "pact_data"
  destination = "/data"
  # Fly's daily volume snapshots stay on as a backstop behind Litestream.
  snapshot_retention = 5

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Fly checks liveness only, which also makes a deploy fail when the new
  # version doesn't come up. /health (scheduler freshness) is deliberately not
  # checked here: with one machine, a failing check would take the whole app
  # offline when only the scheduler is stuck. The external uptime monitor
  # watches /health and emails the operator instead (ADR 0002).
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

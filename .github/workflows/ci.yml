# Every push: typecheck, lint, test and build (`test`), and in parallel the browser
# smoke test (`e2e`). Pushes to main then deploy to Fly, only if both passed (a failing
# test blocks the deploy). Pull requests from branches of this repository run through
# their pushes.
name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # same Node as the Dockerfile
          cache: npm
      - run: npm ci
      - run: npm run check # shellcheck comes preinstalled on ubuntu-latest

  # The Playwright smoke test (e2e/), kept out of `npm run check`. Builds the client itself.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Always run: on a cache hit it skips the download but still installs Chromium's system libraries.
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Only for the check below, which needs no dependencies. If this fails the check warns.
      - uses: actions/setup-node@v7
        continue-on-error: true
        with:
          node-version-file: .nvmrc
      # Blocks only on a definitely missing variable; can't list secrets? It warns, read the log.
      - run: scripts/check-fly-secrets.sh fly.toml timeout 60 flyctl secrets list -a pact-hrishisd --json
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --build-arg PACT_COMMIT=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

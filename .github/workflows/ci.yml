# Every push: typecheck, lint, test and build. Pushes to main then deploy to Fly,
# only if all of that passed (a failing test blocks the deploy).
name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # same Node as the Dockerfile
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint # shellcheck comes preinstalled on ubuntu-latest
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Only for the check below, which needs no dependencies. If this fails the check warns.
      - uses: actions/setup-node@v7
        continue-on-error: true
        with:
          node-version-file: .nvmrc
      # Blocks only on a definitely missing variable; can't list secrets? It warns, read the log.
      - run: scripts/check-fly-secrets.sh fly.toml timeout 60 flyctl secrets list -a pact-hrishisd --json
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
